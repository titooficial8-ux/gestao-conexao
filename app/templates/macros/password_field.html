{% macro password_field(name, id, placeholder='', required=True, minlength=None, autofocus=False, css_class='') %}
<div class="pw-field-wrap">
  <input type="password" name="{{ name }}" id="{{ id }}"{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if css_class %} class="{{ css_class }}"{% endif %}{% if required %} required{% endif %}{% if minlength %} minlength="{{ minlength }}"{% endif %}{% if autofocus %} autofocus{% endif %}>
  <button type="button" class="toggle-password" data-target="{{ id }}" tabindex="-1" aria-label="mostrar senha">
    <svg class="eye-icon eye-open" viewBox="0 0 24 24"><path d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
    <svg class="eye-icon eye-closed" viewBox="0 0 24 24"><path d="M2 2l20 20M9.9 5.1C10.6 5 11.3 5 12 5c7 0 11 7 11 7a18.7 18.7 0 01-3.22 4.19M6.5 6.64A18.7 18.7 0 001 12s4 7 11 7c1.35 0 2.62-.26 3.78-.7M10.6 10.6a3 3 0 004.24 4.24"/></svg>
  </button>
</div>
{% endmacro %}
