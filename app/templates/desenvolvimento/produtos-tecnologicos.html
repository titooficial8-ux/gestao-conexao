{% extends 'base.html' %}
{% block page_title %}{{ tab.name_pt if lang == 'pt' else tab.name_es }}{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dev.css') }}">
<div class="dv">
  <div class="dv-topo"><div><h1>Produtos Tecnológicos</h1><div class="dv-sub">Apresentações em PDF e vídeos dos produtos</div></div></div>
  <div id="bib"></div>
</div>
<script src="{{ url_for('static', filename='js/dev.js') }}"></script>
<script>
DV.api('/dev/eu').then(function (eu) { return DV.biblioteca({ raiz: document.getElementById('bib'), eu: eu, secoes: [{ id: 'produtos_pdf', rotulo: '📄 PDF', aceita: '.pdf', maximo: '500 MB', grade: true, categorias: [] }, { id: 'produtos_video', rotulo: '🎬 Vídeos', aceita: '.mp4,.mov,.webm,.m4v,.avi,.mkv', maximo: '2 GB', grade: true, categorias: [] }] }); })
  .catch(function (e) { document.getElementById('bib').appendChild(DV.el('div', 'dv-aviso', e.message)); });
</script>
{% endblock %}
