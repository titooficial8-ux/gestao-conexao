{% extends 'base.html' %}
{% block page_title %}{{ tab.name_pt if lang == 'pt' else tab.name_es }}{% endblock %}
{% block content %}
<style>
.am{max-width:1280px}.am-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.am-abas{display:inline-flex;background:#eef2f7;border-radius:12px;padding:4px;gap:4px}.am-aba{border:0;background:transparent;padding:9px 20px;border-radius:9px;font-weight:800;font-size:14px;color:#475569;cursor:pointer}.am-aba.on{background:#fff;color:#0f2540;box-shadow:0 1px 4px rgba(15,37,64,.15)}
.am-bt{border:1px solid #cbd5e1;background:#fff;color:#0f2540;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer}.am-bt.pri{background:#2563eb;border-color:#2563eb;color:#fff}.am-bt.on{background:#0f2540;color:#fff;border-color:#0f2540}
.am-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.am-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05);position:relative}
.am-card.and{border-color:#dc2626;box-shadow:0 0 0 2px rgba(220,38,38,.2);animation:amPisca 1.2s infinite}.am-card.prog{border-left:5px solid #f59e0b}.am-card.fin{border-left:5px solid #94a3b8}
@keyframes amPisca{0%,100%{box-shadow:0 0 0 2px rgba(220,38,38,.2)}50%{box-shadow:0 0 0 5px rgba(220,38,38,.5)}}
.am-st{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.06em;border-radius:999px;padding:3px 10px;background:#e5e7eb;color:#475569}.am-st.and{background:#fee2e2;color:#b91c1c}.am-st.prog{background:#fef3c7;color:#92400e}.am-st.fin{background:#e2e8f0;color:#475569}
.am-maq{font-size:26px;font-weight:900;color:#0f2540;margin:6px 0 2px}.am-l{font-size:13px;color:#475569;margin:3px 0}.am-l b{color:#0f172a}.am-warn{font-size:12px;color:#b45309;font-weight:700;margin-top:4px}
.am-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;border-top:1px solid #f1f5f9;padding-top:10px}.am-acoes button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer}.am-acoes .ex{color:#b91c1c;border-color:#fecaca}
.am-vazio{padding:40px;text-align:center;color:#64748b;background:#fff;border:1px dashed #cbd5e1;border-radius:12px}
.am-mod{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:2000}.am-mod[hidden]{display:none}.am-box{background:#fff;border-radius:14px;padding:22px;width:min(520px,94vw);max-height:92vh;overflow:auto}
.am-box h3{margin:0 0 12px}.am-box label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin:10px 0 3px}.am-box input,.am-box select,.am-box textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit}
.am-r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.am-fim{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.am-fim button{border:0;border-radius:8px;padding:9px 18px;font-weight:800;cursor:pointer}.am-ok{background:#2563eb;color:#fff}.am-cn{background:#e5e7eb}.am-err{color:#b91c1c;font-size:13px;margin-top:8px;min-height:16px}
.am-tab{width:100%;border-collapse:collapse;font-size:13px;background:#fff}.am-tab th{background:#f8fafc;padding:9px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;text-align:left;border-bottom:1px solid #e5e7eb;white-space:nowrap}.am-tab td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}.am-tw{border:1px solid #e5e7eb;border-radius:12px;overflow:auto}
.am-info{font-size:12px;color:#64748b;margin:10px 0}
</style>
<div class="am">
  <div class="am-top">
    <div class="am-abas"><button type="button" class="am-aba on" data-t="AMOSTRA">&#129514; Amostras</button><button type="button" class="am-aba" data-t="MANUTENCAO">&#128295; Manutenções</button></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="am-bt" id="amAtu">&#8635; Atualizar</button>
      <button type="button" class="am-bt" id="amHist">&#128368; Histórico</button>
      <button type="button" class="am-bt pri" id="amNovo">+ Novo Aviso</button>
      {% if current_user.is_admin %}<button type="button" class="am-bt" id="amImp" title="Traz para cá o histórico de manutenções e amostras que o PCP Hub tinha">Importar histórico do Hub</button>{% endif %}
    </div>
  </div>
  <div id="amLista"></div>
  <p class="am-info" id="amInfo"></p>
</div>
<div class="am-mod" id="amMod" hidden><div class="am-box">
  <h3 id="amModT">Novo aviso</h3>
  <div class="am-r2"><div><label>Tipo</label><select id="fTipo"><option value="MANUTENCAO">Manutenção</option><option value="AMOSTRA">Amostra</option></select></div><div><label>Máquina</label><input type="text" id="fMaq" placeholder="ex.: 44"></div></div>
  <div class="am-r2"><div><label>Data prevista</label><input type="date" id="fData"></div><div><label>Data de término</label><input type="date" id="fTermino"></div></div>
  <label>Horas estimadas</label><input type="text" id="fHoras" placeholder="ex.: 4">
  <label>Mecânico(s)</label><input type="text" id="fMec" placeholder="ex.: Jose/Junior">
  <div class="am-r2"><div><label>Início</label><input type="datetime-local" id="fIni"></div><div><label>Encerramento</label><input type="datetime-local" id="fFim"></div></div>
  <label>Observação</label><textarea id="fObs" rows="3"></textarea>
  <div class="am-err" id="amErr"></div>
  <div class="am-fim"><button type="button" class="am-cn" id="amCn">Cancelar</button><button type="button" class="am-ok" id="amSalvar">Salvar</button></div>
</div></div>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); }, tipo = 'AMOSTRA', hist = false, edita = false, itens = [], editId = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function post(u, b) { return fetch(u, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b || {}) }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.erro || 'Erro'); return d; }); }); }
  function stTxt(a) { return a.status === 'EM_ANDAMENTO' ? ['and', 'EM ANDAMENTO'] : (a.status === 'PROGRAMADA' ? ['prog', 'PROGRAMADA'] : ['fin', 'FINALIZADA']); }
  function card(a) {
    var s = stTxt(a), rot = a.tipo === 'AMOSTRA' ? 'Amostra' : 'Manutenção';
    return '<div class="am-card ' + s[0] + '"><span class="am-st ' + s[0] + '">' + s[1] + '</span><div class="am-maq">&#9881; ' + esc(a.maquina) + '</div>' +
      '<div class="am-l">&#9201; ' + (a.horas != null ? esc(a.horas) + 'h estimadas' : '0h estimadas') + '</div>' + (a.data ? '<div class="am-l">&#128197; ' + esc(a.data) + '</div>' : '') + (a.termino ? '<div class="am-l">&#127937; Término: <b>' + esc(a.termino) + '</b></div>' : '') +
      (a.mecanico ? '<div class="am-l">&#128295; Mecânico: <b>' + esc(a.mecanico) + '</b></div>' : '') + (a.inicio ? '<div class="am-l">Início: <b>' + esc(a.inicio) + '</b></div>' : '') +
      (a.fim ? '<div class="am-l">Encerrada: <b>' + esc(a.fim) + '</b></div>' : '') + (a.duracao ? '<div class="am-l">Duração' + (a.status === 'EM_ANDAMENTO' ? ' até agora' : ' real') + ': <b>' + esc(a.duracao) + '</b></div>' : '') +
      (a.anomalia ? '<div class="am-warn">&#9888; Encerramento anterior ao início — verificar as datas</div>' : '') + (a.obs ? '<div class="am-l" style="margin-top:6px">' + esc(a.obs) + '</div>' : '') +
      '<div class="am-l" style="color:#94a3b8">' + rot + (a.origem === 'acomp' ? ' · aberta pelo líder no Acompanhamento' : (a.origem === 'hub' ? ' · PCP Hub' : '')) + '</div>' +
      (edita ? '<div class="am-acoes"><button type="button" data-ed="' + a.id + '">Editar</button>' + (a.status !== 'FINALIZADA' ? '<button type="button" data-enc="' + a.id + '">Encerrar</button>' : '') + '<button type="button" class="ex" data-ex="' + a.id + '">Excluir</button></div>' : '') + '</div>';
  }
  function tabela(l) {
    return '<div class="am-tw"><table class="am-tab"><thead><tr><th>Máquina</th><th>Data</th><th>Término</th><th>Mecânico</th><th>Início</th><th>Encerrada</th><th>Duração</th><th>Obs.</th>' + (edita ? '<th></th>' : '') + '</tr></thead><tbody>' +
      l.map(function (a) { return '<tr><td><b>' + esc(a.maquina) + '</b></td><td>' + esc(a.data) + '</td><td>' + esc(a.mecanico) + '</td><td>' + esc(a.inicio) + '</td><td>' + esc(a.fim) + (a.anomalia ? ' <span class="am-warn">&#9888;</span>' : '') + '</td><td>' + esc(a.duracao || '') + '</td><td>' + esc(a.obs) + '</td>' +
        (edita ? '<td style="white-space:nowrap"><button type="button" class="am-bt" data-ed="' + a.id + '" style="padding:4px 10px">Editar</button> <button type="button" class="am-bt" data-ex="' + a.id + '" style="padding:4px 10px;color:#b91c1c">Excluir</button></td>' : '') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function carregar() {
    $('amLista').innerHTML = '<div class="am-vazio">Carregando…</div>';
    return fetch('/manutencoes/dados?tipo=' + tipo + (hist ? '&historico=1' : ''), { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) {
      itens = d.itens || []; edita = !!d.pode_editar;
      $('amLista').innerHTML = !itens.length ? '<div class="am-vazio">' + (hist ? 'Nenhum registro no histórico.' : 'Nenhum aviso ' + (tipo === 'AMOSTRA' ? 'de amostra' : 'de manutenção') + ' em aberto.') + '</div>' : (hist ? tabela(itens) : '<div class="am-grid">' + itens.map(card).join('') + '</div>');
      $('amInfo').textContent = hist ? itens.length + ' registro(s) no histórico (de ' + d.total_hist + ').' : 'Quando o líder sinaliza ' + (tipo === 'AMOSTRA' ? 'uma amostra' : 'uma manutenção') + ' no Acompanhamento de Produção, o aviso entra em andamento sozinho (e a máquina pisca na Programação); ao encerrar, vai para o Histórico.';
    }).catch(function () { $('amLista').innerHTML = '<div class="am-vazio">Não consegui carregar.</div>'; });
  }
  document.querySelectorAll('.am-aba').forEach(function (b) { b.addEventListener('click', function () { tipo = b.dataset.t; document.querySelectorAll('.am-aba').forEach(function (x) { x.classList.toggle('on', x === b); }); carregar(); }); });
  $('amAtu').addEventListener('click', carregar);
  $('amHist').addEventListener('click', function () { hist = !hist; $('amHist').classList.toggle('on', hist); carregar(); });
  function abrir(a) {
    editId = a ? a.id : null; $('amModT').textContent = a ? 'Editar aviso' : 'Novo aviso'; $('amErr').textContent = '';
    $('fTipo').value = a ? a.tipo : tipo; $('fTipo').disabled = !!a; $('fMaq').value = a ? a.maquina : ''; $('fData').value = a ? a.data_iso : ''; $('fTermino').value = a ? a.termino_iso : ''; $('fHoras').value = a && a.horas != null ? a.horas : '';
    $('fMec').value = a ? a.mecanico : ''; $('fIni').value = a ? a.inicio_iso : ''; $('fFim').value = a ? a.fim_iso : ''; $('fObs').value = a ? a.obs : ''; $('amMod').hidden = false;
  }
  $('amNovo').addEventListener('click', function () { abrir(null); });
  $('amCn').addEventListener('click', function () { $('amMod').hidden = true; });
  $('amSalvar').addEventListener('click', function () {
    var c = { tipo: $('fTipo').value, maquina: $('fMaq').value, data: $('fData').value, termino: $('fTermino').value, horas: $('fHoras').value, mecanico: $('fMec').value, inicio: $('fIni').value, fim: $('fFim').value, obs: $('fObs').value };
    post(editId ? '/manutencoes/avisos/' + editId : '/manutencoes/avisos', c).then(function () { $('amMod').hidden = true; carregar(); }).catch(function (e) { $('amErr').textContent = e.message; });
  });
  $('amLista').addEventListener('click', function (e) {
    var b = e.target.closest('[data-ed],[data-enc],[data-ex]'); if (!b) return;
    var id = b.dataset.ed || b.dataset.enc || b.dataset.ex, a = itens.filter(function (x) { return String(x.id) === String(id); })[0];
    if (b.dataset.ed) abrir(a);
    else if (b.dataset.enc) { if (confirm('Encerrar este aviso agora?')) { var n = new Date(), p = function (v) { return String(v).padStart(2, '0'); }; post('/manutencoes/avisos/' + id, { fim: n.getFullYear() + '-' + p(n.getMonth() + 1) + '-' + p(n.getDate()) + 'T' + p(n.getHours()) + ':' + p(n.getMinutes()) }).then(carregar).catch(function (er) { alert(er.message); }); } }
    else if (b.dataset.ex && confirm('Excluir este registro? Não dá para desfazer.')) post('/manutencoes/avisos/' + id + '/excluir').then(carregar).catch(function (er) { alert(er.message); });
  });
  if ($('amImp')) $('amImp').addEventListener('click', function () {
    $('amImp').disabled = true; $('amImp').textContent = 'Importando…';
    fetch('/manutencoes/importar-hub', { method: 'POST', credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) { alert(JSON.stringify(d, null, 1)); carregar(); }).catch(function () { alert('Falhou.'); }).then(function () { $('amImp').disabled = false; $('amImp').textContent = 'Importar histórico do Hub'; });
  });
  carregar(); setInterval(function () { if (!hist && $('amMod').hidden) carregar(); }, 60000);
})();
</script>
{% endblock %}
