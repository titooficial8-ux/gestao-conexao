{% extends 'base.html' %}
{% block page_title %}{{ tab.name_pt if lang == 'pt' else tab.name_es }}{% endblock %}
{% block content %}
<style>
  .ce { --cinza: #6a7b90; }
  .ce-topo { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin: 4px 0 14px; }
  .ce-topo h1 { margin: 0; font-size: 26px; line-height: 1.15; color: #0f2540; }
  .ce-sub { font-size: 12.5px; color: var(--cinza); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  .ce-dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; display: inline-block; margin-right: 6px; animation: biPonto 1.4s ease-in-out infinite; }
  .ce-aviso { margin: 0 0 14px; padding: 12px 16px; border-radius: 12px; background: #fff7e6; border: 1px solid #f3d9a4; color: #7a5200; font-size: 13px; }

  .ce-hero { display: grid; grid-template-columns: 1.1fr 1.6fr 1fr; gap: 28px; padding: 26px 28px; border-radius: 18px; color: #fff; align-items: center;
    background: linear-gradient(120deg, #0a2540 0%, #0f3a66 55%, #16508a 100%); box-shadow: 0 12px 32px rgba(10, 37, 64, .25); }
  .ce-hero-rot { font-size: 10.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #8fb4dc; }
  .ce-hero-big { font-size: 44px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; margin: 8px 0 6px; font-variant-numeric: tabular-nums; }
  .ce-hero-big small { font-size: 18px; font-weight: 700; color: #b9d0ea; margin-left: 6px; }
  .ce-hero-txt { font-size: 12.5px; color: #b9d0ea; line-height: 1.5; }
  .ce-hero-mid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; padding: 0 26px; border-left: 1px solid rgba(255, 255, 255, .14); border-right: 1px solid rgba(255, 255, 255, .14); }
  .ce-m-val { font-size: 30px; font-weight: 800; margin: 8px 0 4px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .ce-m-val small { font-size: 14px; font-weight: 700; color: #b9d0ea; margin-left: 4px; }
  .ce-delta { display: inline-block; font-size: 11.5px; font-weight: 800; padding: 2px 9px; border-radius: 999px; }
  .ce-delta.bom { background: rgba(61, 220, 132, .18); color: #7be0a6; }
  .ce-delta.ruim { background: rgba(255, 107, 107, .2); color: #ffb4b4; }
  .ce-saude { display: flex; align-items: center; gap: 16px; }
  .ce-saude-graf { position: relative; width: 118px; height: 118px; flex: none; }
  .ce-saude-centro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .ce-saude-centro b { font-size: 24px; line-height: 1; }
  .ce-saude-centro span { font-size: 9.5px; color: #8fb4dc; letter-spacing: .1em; text-transform: uppercase; margin-top: 3px; }
  .ce-leg { display: grid; gap: 7px; font-size: 12px; color: #d4e0ee; }
  .ce-leg i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 8px; }
  .ce-leg b { margin-left: 6px; color: #fff; }

  .ce-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 14px 0; }
  .ce-kpi { background: #fff; border: 1px solid #e1e9f3; border-radius: 14px; padding: 16px 18px; position: relative; overflow: hidden; box-shadow: 0 1px 2px rgba(16, 38, 63, .04), 0 8px 20px rgba(16, 38, 63, .05); }
  .ce-kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, #2f7fe0); }
  .ce-kpi-rot { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #5d6e84; }
  .ce-kpi-val { font-size: 28px; font-weight: 800; color: #0f2540; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
  .ce-kpi-sub { font-size: 12px; color: var(--cinza); line-height: 1.45; }

  .ce-linha { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .ce-card { background: #fff; border: 1px solid #e1e9f3; border-radius: 14px; padding: 18px 20px 14px; box-shadow: 0 1px 2px rgba(16, 38, 63, .04), 0 8px 20px rgba(16, 38, 63, .05); }
  .ce-card h3 { margin: 0 0 2px; font-size: 15px; color: #0f2540; }
  .ce-card p.m { margin: 0 0 10px; font-size: 12px; color: var(--cinza); }
  .ce-graf { position: relative; height: 320px; }
  .ce-vazio { color: var(--cinza); font-size: 13px; padding: 40px 10px; text-align: center; }
  .ce-pill { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 3px 10px; border-radius: 999px; letter-spacing: .03em; }
  .ce-pill.crit { background: #fdeaea; color: #b62027; }
  .ce-pill.aten { background: #fff3dc; color: #9a6200; }
  .ce-pill.ok { background: #e3f5ea; color: #11703c; }
  .ce-pill.par { background: #eceff4; color: #4d5d72; }
  .ce-nota { font-size: 11.5px; color: #7c8ca1; margin: 6px 2px 18px; line-height: 1.5; }
  .ce-sec { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #46586e; margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
  .ce-sec::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, #d5dfec, transparent); }
  @media (max-width: 1100px) { .ce-hero { grid-template-columns: 1fr; } .ce-hero-mid { border: 0; padding: 0; } .ce-kpis { grid-template-columns: repeat(2, 1fr); } .ce-linha { grid-template-columns: 1fr; } }
</style>

<div class="ce">
  <div class="ce-topo">
    <div>
      <h1>{{ tab.name_pt if lang == 'pt' else tab.name_es }}</h1>
      <div class="ce-sub" id="ceStatus">Consultando o TOTVS…</div>
    </div>
    <button type="button" class="btn-small ticket-btn-outline" id="ceAtualizar">⟳ Atualizar agora</button>
  </div>
  <div id="ceAviso"></div>
  <div id="ceCorpo"></div>

  <div class="ce-sec">Relação de matéria-prima</div>
  <div class="prod-filters"><input type="text" id="buscaAlmox" class="prod-search" placeholder="Pesquisar matéria-prima (código ou descrição)" autocomplete="off"></div>
  <div class="table-card" style="margin-top:10px;">
    <div class="table-scroll">
      <table class="data-table prod-table">
        <thead><tr><th>Código</th><th>Descrição</th><th>Origem</th><th>Un.</th><th class="cme-num">Saldo</th></tr></thead>
        <tbody id="almoxCorpo"><tr><td colspan="5" class="prod-table-empty">Carregando…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/vendor/chart.umd.js') }}"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, dados = null, ind = null, graf = {};
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
  function nf(v, d) { return v === null || v === undefined ? '—' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function pct(v, d) { return v === null || v === undefined ? '—' : nf(v * 100, d === undefined ? 1 : d) + '%'; }
  function dh(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + ' ' + iso.slice(11, 16) : '—'; }
  function curto(t, n) { return t.length > n ? t.slice(0, n - 1) + '…' : t; }
  function pill(cls, txt) { return el('span', 'ce-pill ' + cls, txt); }
  function situacao(i) { if (!i) return el('span'); if (i.out90 === 0) return i.saldo > 0 ? pill('par', 'PARADO') : pill('ok', '—'); if (i.cobertura !== null && i.cobertura < 15) return pill('crit', 'CRÍTICO'); if (i.cobertura !== null && i.cobertura < 30) return pill('aten', 'ATENÇÃO'); return pill('ok', 'OK'); }
  function kpi(rot, val, sub, cor) { var k = el('div', 'ce-kpi'); k.style.setProperty('--c', cor); k.appendChild(el('div', 'ce-kpi-rot', rot)); k.appendChild(el('div', 'ce-kpi-val', val)); k.appendChild(el('div', 'ce-kpi-sub', sub)); return k; }
  function cartao(titulo, meta) { var c = el('div', 'ce-card'); c.appendChild(el('h3', null, titulo)); c.appendChild(el('p', 'm', meta)); return c; }
  function graficoEm(card) { var w = el('div', 'ce-graf'), cv = document.createElement('canvas'); w.appendChild(cv); card.appendChild(w); return cv; }
  function tabela(cols, linhas, vazio) {
    if (!linhas.length) return el('div', 'ce-vazio', vazio);
    var w = el('div', 'table-scroll'), t = el('table', 'data-table prod-table'), th = el('thead'), tr = el('tr');
    cols.forEach(function (c) { tr.appendChild(el('th', c.num ? 'cme-num' : null, c.t)); }); th.appendChild(tr); t.appendChild(th);
    var b = el('tbody'); linhas.forEach(function (l) { var r = el('tr'); cols.forEach(function (c) { var td = el('td', c.num ? 'cme-num' : null), v = c.f(l); if (v instanceof Node) td.appendChild(v); else td.textContent = v; r.appendChild(td); }); b.appendChild(r); });
    t.appendChild(b); w.appendChild(t); return w;
  }
  var EIXO = { grid: { color: 'rgba(120,130,150,.15)' }, border: { display: false } };

  function desenhar() {
    var box = $('ceCorpo'); box.textContent = '';
    Object.keys(graf).forEach(function (k) { try { graf[k].destroy(); } catch (e) {} }); graf = {};
    if (!dados || !dados.itens || !dados.itens.length) { box.appendChild(el('div', 'ce-card ce-vazio', dados && dados.atualizado ? 'Nenhuma matéria-prima com saldo no almoxarifado.' : 'Aguardando a primeira consulta ao TOTVS…')); return; }
    var itens = dados.itens.slice().sort(function (x, y) { return y.saldo - x.saldo; }), total = itens.reduce(function (s, i) { return s + i.saldo; }, 0);
    function grupo(i) { var o = (i.origem || '').toUpperCase(); return o.indexOf('PROP') === 0 ? 'prop' : (o.indexOf('TERC') === 0 ? 'terc' : 'sem'); }
    var soma = { prop: 0, terc: 0, sem: 0 }, qtd = { prop: 0, terc: 0, sem: 0 };
    itens.forEach(function (i) { var g = grupo(i); soma[g] += i.saldo; qtd[g]++; });
    var top10 = itens.slice(0, 10), pTop10 = total ? top10.reduce(function (s, i) { return s + i.saldo; }, 0) / total : 0, maior = itens[0];
    var acum = 0, n80 = 0; itens.forEach(function (i) { if (acum / total < 0.8) n80++; acum += i.saldo; });
    var baixos = itens.filter(function (i) { return i.minimo > 0 ? i.saldo < i.minimo : i.saldo < 100; }), temMin = itens.some(function (i) { return i.minimo > 0; });

    // ---- faixa principal (diretoria)
    var h = el('div', 'ce-hero');
    var a = el('div'); a.appendChild(el('div', 'ce-hero-rot', 'Estoque de matéria-prima')); var big = el('div', 'ce-hero-big', nf(total)); big.appendChild(el('small', null, 'kg')); a.appendChild(big);
    a.appendChild(el('div', 'ce-hero-txt', itens.length + ' itens ativos em KG · ' + (dados.estoque_nome || 'Almoxarifado'))); h.appendChild(a);
    var m = el('div', 'ce-hero-mid');
    function metrica(rot, val, un, extra) { var d = el('div'); d.appendChild(el('div', 'ce-hero-rot', rot)); var v = el('div', 'ce-m-val', val); if (un) v.appendChild(el('small', null, un)); d.appendChild(v); if (extra) d.appendChild(el('div', 'ce-hero-txt', extra)); return d; }
    m.appendChild(metrica('Maior saldo', nf(maior.saldo / 1000, 1), 't', curto(maior.nome, 30)));
    m.appendChild(metrica('Top 10 concentram', pct(pTop10, 0), '', 'do estoque total'));
    m.appendChild(metrica('80% do estoque em', String(n80), 'itens', 'de ' + itens.length + ' matérias-primas'));
    h.appendChild(m);
    var sa = el('div', 'ce-saude'), gw = el('div', 'ce-saude-graf'), cvS = document.createElement('canvas'); gw.appendChild(cvS);
    var ct = el('div', 'ce-saude-centro'); ct.appendChild(el('b', null, pct(total ? soma.prop / total : 0, 0))); ct.appendChild(el('span', null, 'próprio')); gw.appendChild(ct); sa.appendChild(gw);
    var lg = el('div', 'ce-leg'); [['#3ddc84', 'Próprio', soma.prop], ['#5eb0ff', 'Terceiros', soma.terc], ['#8aa0ba', 'Sem origem', soma.sem]].forEach(function (x) { if (!x[2] && x[0] === '#8aa0ba') return; var r = el('div'); var i = el('i'); i.style.background = x[0]; r.appendChild(i); r.appendChild(document.createTextNode(x[1])); r.appendChild(el('b', null, nf(x[2] / 1000, 1) + ' t')); lg.appendChild(r); }); sa.appendChild(lg);
    h.appendChild(sa); box.appendChild(h);
    graf.origem = new Chart(cvS, { type: 'doughnut', data: { labels: ['Próprio', 'Terceiros', 'Sem origem'], datasets: [{ data: [soma.prop, soma.terc, soma.sem], backgroundColor: ['#3ddc84', '#5eb0ff', '#8aa0ba'], borderWidth: 0 }] }, options: { cutout: '74%', plugins: { legend: { display: false } }, maintainAspectRatio: false } });

    // ---- cartoes de gestao
    var kp = el('div', 'ce-kpis');
    kp.appendChild(kpi('Itens em estoque', String(itens.length), 'matérias-primas ativas com saldo', '#1f4e79'));
    kp.appendChild(kpi('Produção própria', nf(soma.prop / 1000, 1) + ' t', qtd.prop + ' itens · ' + pct(total ? soma.prop / total : 0, 0) + ' do estoque', '#1f9d55'));
    kp.appendChild(kpi('Terceiros', nf(soma.terc / 1000, 1) + ' t', qtd.terc + ' itens · ' + pct(total ? soma.terc / total : 0, 0) + ' do estoque', '#2f7fe0'));
    kp.appendChild(kpi(temMin ? 'Abaixo do mínimo' : 'Saldo abaixo de 100 kg', String(baixos.length), temMin ? 'itens com saldo menor que o estoque mínimo do cadastro' : 'itens quase zerados, para acompanhar a reposição', baixos.length ? '#e0972f' : '#1f9d55'));
    box.appendChild(kp);

    // ---- graficos
    var l1 = el('div', 'ce-linha');
    var c1 = cartao('Maiores saldos em estoque', '10 matérias-primas com mais quilos no almoxarifado'), cv1 = graficoEm(c1); l1.appendChild(c1);
    graf.saldos = new Chart(cv1, { type: 'bar', data: { labels: top10.map(function (x) { return curto(x.nome, 34); }), datasets: [{ data: top10.map(function (x) { return Math.round(x.saldo); }), backgroundColor: top10.map(function (x) { return grupo(x) === 'terc' ? '#5eb0ff' : '#2f7fe0'; }), borderRadius: 5, barThickness: 18 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, layout: { padding: { right: 60 } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (x) { return nf(x.raw) + ' kg · ' + pct(total ? x.raw / total : 0, 1) + ' do estoque'; } } } }, scales: { x: Object.assign({ beginAtZero: true, ticks: { callback: function (v) { return nf(v / 1000) + ' t'; } } }, EIXO), y: { grid: { display: false }, ticks: { font: { size: 11 } } } } },
      plugins: [{ id: 'rot', afterDatasetsDraw: function (ch) { var x = ch.ctx; x.save(); x.font = '700 11px sans-serif'; x.fillStyle = '#10263F'; x.textBaseline = 'middle'; ch.getDatasetMeta(0).data.forEach(function (e, i) { x.fillText(nf(top10[i].saldo / 1000, 1) + ' t', e.x + 6, e.y); }); x.restore(); } }] });
    var c2 = cartao('Concentração do estoque · curva ABC', 'Quanto do estoque total cada quantidade de itens representa (itens ordenados do maior para o menor saldo)'), cv2 = graficoEm(c2); l1.appendChild(c2);
    var cum = 0, pts = itens.map(function (i, k) { cum += i.saldo; return { x: k + 1, y: Math.round(cum / total * 1000) / 10 }; });
    graf.abc = new Chart(cv2, { type: 'line', data: { datasets: [{ data: pts, borderColor: '#2f7fe0', backgroundColor: 'rgba(47,127,224,.14)', fill: true, tension: .25, pointRadius: 0, borderWidth: 2.5 }] },
      options: { responsive: true, maintainAspectRatio: false, parsing: false, plugins: { legend: { display: false }, tooltip: { callbacks: { title: function (x) { return x[0].raw.x + ' maiores itens'; }, label: function (x) { return x.raw.y + '% do estoque'; } } } }, scales: { x: { type: 'linear', min: 1, max: itens.length, title: { display: true, text: 'quantidade de itens (do maior saldo para o menor)' }, grid: { display: false } }, y: Object.assign({ min: 0, max: 100, ticks: { callback: function (v) { return v + '%'; } } }, EIXO) } } });
    box.appendChild(l1);

    var l2 = el('div', 'ce-linha');
    var c3 = cartao('Menores saldos · atenção à reposição', temMin ? 'Itens com saldo abaixo do estoque mínimo cadastrado' : 'Itens com menos de 100 kg em estoque');
    var lista = baixos.slice().sort(function (x, y) { return x.saldo - y.saldo; }).slice(0, 10);
    c3.appendChild(tabela([{ t: 'Matéria-prima', f: function (x) { return curto(x.nome, 38); } }, { t: 'Origem', f: function (x) { return x.origem || ''; } }, { t: 'Saldo', num: 1, f: function (x) { return nf(x.saldo, 1) + ' kg'; } }].concat(temMin ? [{ t: 'Mínimo', num: 1, f: function (x) { return x.minimo ? nf(x.minimo) + ' kg' : '—'; } }] : []), lista, 'Nenhum item com saldo baixo.'));
    l2.appendChild(c3);
    var c4 = cartao('Maiores saldos · detalhe', 'Os 10 itens que mais pesam no estoque');
    c4.appendChild(tabela([{ t: 'Matéria-prima', f: function (x) { return curto(x.nome, 38); } }, { t: 'Origem', f: function (x) { return x.origem || ''; } }, { t: 'Saldo', num: 1, f: function (x) { return nf(x.saldo) + ' kg'; } }, { t: '% do total', num: 1, f: function (x) { return pct(total ? x.saldo / total : 0, 1); } }], top10, 'Sem dados.'));
    l2.appendChild(c4); box.appendChild(l2);
    box.appendChild(el('p', 'ce-nota', 'Saldo do ' + (dados.estoque_nome || 'almoxarifado') + ' direto do TOTVS (consulta a cada 5 minutos). Itens ativos, em KG, tipo matéria-prima. Atualizado em ' + dh(dados.atualizado) + '.'));
  }

  function desenharTabela() {
    var corpo = $('almoxCorpo'); corpo.textContent = '';
    var q = ($('buscaAlmox').value || '').trim().toLowerCase(), lista = ((dados && dados.itens) || []).filter(function (i) { return !q || String(i.codigo).indexOf(q) >= 0 || (i.nome || '').toLowerCase().indexOf(q) >= 0; }).sort(function (x, y) { return y.saldo - x.saldo; });
    if (!lista.length) { var r0 = el('tr'), c0 = el('td', 'prod-table-empty', 'Nenhuma matéria-prima encontrada.'); c0.colSpan = 5; r0.appendChild(c0); corpo.appendChild(r0); return; }
    lista.forEach(function (i) {
      var r = el('tr'); [[i.codigo], [i.nome], [i.origem || ''], [i.unidade || ''], [nf(i.saldo, 1), 'cme-num']].forEach(function (c) { r.appendChild(el('td', c[1], String(c[0]))); }); corpo.appendChild(r);
    });
  }

  function status() {
    var s = $('ceStatus'); s.textContent = '';
    if (dados && dados.atualizado) {
      var a = el('span'); a.appendChild(el('span', 'ce-dot')); a.appendChild(document.createTextNode('TOTVS · ao vivo')); s.appendChild(a);
      s.appendChild(el('span', null, 'Saldo atualizado ' + dh(dados.atualizado)));
      if (dados.filtro_mp) s.appendChild(el('span', null, 'Filtro: ' + dados.filtro_mp));
    } else s.textContent = 'Consultando o TOTVS…';
    var av = $('ceAviso'); av.textContent = '';
    if (dados && !dados.configurado) av.appendChild(el('div', 'ce-aviso', 'TOTVS não configurado no arquivo .env.'));
    else if (dados && dados.estado && dados.estado.erro) av.appendChild(el('div', 'ce-aviso', '⚠ Falha ao consultar o saldo no TOTVS: ' + dados.estado.erro));
  }

  function carregar() {
    fetch('/estoque-almox/dados', { credentials: 'same-origin' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { var sig = (d.atualizado || '') + '|' + ((d.estado && d.estado.erro) || ''); var mudou = sig !== $('ceCorpo').dataset.sig; dados = d; status(); desenharTabela(); if (mudou) { $('ceCorpo').dataset.sig = sig; desenhar(); } })
      .catch(function (e) { $('ceStatus').textContent = 'Não consegui carregar (' + e.message + ').'; });
  }
  $('buscaAlmox').addEventListener('input', desenharTabela);
  $('ceAtualizar').addEventListener('click', function () { $('ceStatus').textContent = 'Consultando o TOTVS…'; fetch('/estoque-almox/atualizar', { method: 'POST', credentials: 'same-origin' }).then(function () { setTimeout(carregar, 5000); }); });
  carregar(); setInterval(carregar, 30000);
})();
</script>
{% endblock %}
