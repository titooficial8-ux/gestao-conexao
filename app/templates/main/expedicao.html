{% extends 'base.html' %}
{% block page_title %}{{ tab.name_pt if lang == 'pt' else tab.name_es }}{% endblock %}
{% block content %}
<style>
.xp{--xp-teal:#0d9488;--xp-navy:#0f2a4a;max-width:1400px}
.xp-hero{background:linear-gradient(120deg,#0f2a4a 0%,#14527a 55%,#0d9488 130%);border-radius:18px;padding:22px 26px 24px;color:#fff;margin-bottom:16px;box-shadow:0 10px 30px rgba(15,42,74,.25)}
.xp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.xp-top h2{margin:0;font-size:22px;letter-spacing:-.01em;color:#fff}.xp-top p{margin:3px 0 0;font-size:13px;color:#b8d4ea}
.xp-live{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:#d6e8f6}
.xp-dot{width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:xpPulse 2s infinite}.xp-dot.off{background:#f59e0b;animation:none}
@keyframes xpPulse{70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.xp-live select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;font-size:13px}.xp-live select option{color:#16283c}
.xp-heads{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.xp-head{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px 16px;min-width:0}
.xp-head span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a9c8e2}
.xp-head strong{display:block;font-size:32px;line-height:1.1;margin:6px 0 4px;letter-spacing:-.02em;white-space:nowrap}
.xp-head em{font-style:normal;font-size:12px;color:#c4dcee;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xp-var{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800}.xp-var.up{background:rgba(52,211,153,.25);color:#86efac}.xp-var.down{background:rgba(248,113,113,.25);color:#fecaca}
.xp-erro{background:#fde7e8;color:#b3262b;border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:12px}
.xp-alerts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.xp-al{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:13px 15px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.xp-al.click{cursor:pointer;transition:transform .12s,box-shadow .12s}.xp-al.click:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,42,74,.14)}
.xp-al .ver{margin-left:auto;font-size:11px;font-weight:800;color:var(--xp-teal);white-space:nowrap}
.xp-mod{position:fixed;inset:0;background:rgba(15,42,74,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.xp-mod>div{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.xp-mod header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 10px}.xp-mod header h3{margin:0;font-size:17px;color:var(--xp-navy)}.xp-mod header p{margin:3px 0 0;font-size:12px;color:var(--gray-500)}
.xp-mod header button{border:0;background:var(--gray-100);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--gray-700,#334155)}
.xp-mod .corpo{padding:0 22px 20px;overflow:auto}
.xp-al i{flex:none;width:12px;height:12px;border-radius:50%}.xp-al.ok i{background:#16a34a}.xp-al.warn i{background:#f59e0b}.xp-al.bad i{background:#dc2626}.xp-al.info i{background:#64748b}
.xp-al b{display:block;font-size:20px;color:var(--text);line-height:1.15}.xp-al span{font-size:12px;color:var(--gray-500)}
.xp-sec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--gray-500);margin:24px 2px 10px}
.xp-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}.xp-grid.eq{grid-template-columns:1fr 1fr}
.xp-card{background:#fff;border:1px solid var(--gray-200);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.xp-card h3{margin:0;font-size:15px;color:var(--xp-navy)}.xp-card .sub{font-size:12px;color:var(--gray-500);margin:2px 0 12px}
.xp-tabs{display:inline-flex;background:var(--gray-100);border-radius:999px;padding:3px;float:right}.xp-tabs button{border:0;background:none;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--gray-500);cursor:pointer}.xp-tabs button.on{background:#fff;color:var(--xp-navy);box-shadow:0 1px 3px #0002}
.xp-chart{width:100%;height:auto;display:block}
.xp-donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.xp-leg{flex:1;min-width:150px;font-size:13px}
.xp-leg div{display:flex;align-items:center;gap:8px;margin:7px 0}.xp-leg i{width:11px;height:11px;border-radius:3px;flex:none}.xp-leg em{margin-left:auto;font-style:normal;font-weight:700;white-space:nowrap}
.xp-rk{display:grid;grid-template-columns:24px 1fr auto;gap:2px 10px;margin:11px 0;font-size:13px;align-items:center}
.xp-rk .pos{font-weight:800;color:var(--gray-500);font-size:12px}.xp-rk .nome{line-height:1.25;min-width:0}.xp-rk .nome b{color:var(--xp-navy)}.xp-rk .nome small{display:block;color:var(--gray-500);font-size:11px;margin-top:1px}
.xp-rk .val{text-align:right;white-space:nowrap;font-weight:800;color:var(--text)}.xp-rk .val small{display:block;font-weight:600;color:var(--gray-500);font-size:11px}
.xp-rk .barra{grid-column:2/4;height:6px;background:var(--gray-100);border-radius:999px;overflow:hidden}.xp-rk .barra i{display:block;height:100%;border-radius:999px}
.xp-chip{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:6px;padding:0 6px;font-size:10px;font-weight:800;margin-left:6px;vertical-align:1px}
.xp-stack{display:flex;height:22px;border-radius:999px;overflow:hidden;background:var(--gray-100);margin:6px 0 14px}.xp-stack i{display:block;height:100%}
.xp-ft{width:100%;border-collapse:collapse;font-size:13px}.xp-ft td,.xp-ft th{padding:7px 6px;border-bottom:1px solid var(--gray-100);text-align:right}.xp-ft th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500)}.xp-ft td:first-child,.xp-ft th:first-child{text-align:left}
.xp-ft i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.xp-tb{width:100%;border-collapse:collapse;font-size:13px}.xp-tb th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500);padding:6px 8px;border-bottom:1px solid var(--gray-200)}
.xp-tb td{padding:8px;border-bottom:1px solid var(--gray-100);vertical-align:middle}.xp-tb td.n{text-align:right;white-space:nowrap}
.xp-pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.xp-vazio{padding:18px;text-align:center;color:var(--gray-500);font-size:13px}
.xp-nota{font-size:12px;color:var(--gray-500);background:var(--gray-100);border-radius:10px;padding:9px 12px;margin-top:10px}
@media(max-width:1000px){.xp-heads,.xp-alerts{grid-template-columns:1fr 1fr}.xp-grid,.xp-grid.eq{grid-template-columns:1fr}}
@media(max-width:560px){.xp-heads,.xp-alerts{grid-template-columns:1fr}}
</style>
