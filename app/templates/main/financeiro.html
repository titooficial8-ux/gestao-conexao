{% extends 'base.html' %}

{% block content %}
<style>
.fn,.fn-mod{--fn-navy:#0f2a4a;--fn-green:#0d9488}.fn{max-width:1400px}
.fn-hero{background:linear-gradient(120deg,#0f2a4a 0%,#134a63 55%,#0d7a6c 130%);border-radius:18px;padding:22px 26px 24px;color:#fff;margin-bottom:16px;box-shadow:0 10px 30px rgba(15,42,74,.25)}
.fn-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.fn-top h2{margin:0;font-size:22px;color:#fff}.fn-top p{margin:3px 0 0;font-size:13px;color:#b8d4ea}

@keyframes fnP{70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.fn-heads{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.fn-head{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px 16px;min-width:0}.fn-head span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a9c8e2}
.fn-head strong{display:block;font-size:30px;line-height:1.1;margin:6px 0 4px;letter-spacing:-.02em;white-space:nowrap}.fn-head em{font-style:normal;font-size:12px;color:#c4dcee}.fn-head.bad strong{color:#fecaca}
.fn-erro{background:#fde7e8;color:#b3262b;border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:12px}
.fn-views{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}.fn-views button{border:1px solid var(--gray-200);background:#fff;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:800;color:var(--gray-500);cursor:pointer;box-shadow:var(--shadow)}.fn-views button.on{background:var(--fn-navy);color:#fff;border-color:var(--fn-navy)}
.fn-alerts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.fn-al{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:13px 15px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}.fn-al i{flex:none;width:12px;height:12px;border-radius:50%}.fn-al.ok i{background:#16a34a}.fn-al.warn i{background:#f59e0b}.fn-al.bad i{background:#dc2626}.fn-al.info i{background:#64748b}
.fn-al b{display:block;font-size:20px;color:var(--text);line-height:1.15}.fn-al span{font-size:12px;color:var(--gray-500)}.fn-al.click{cursor:pointer;transition:transform .12s}.fn-al.click:hover{transform:translateY(-2px)}.fn-al .ver{margin-left:auto;font-size:11px;font-weight:800;color:var(--fn-green)}
.fn-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}.fn-card{background:#fff;border:1px solid var(--gray-200);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}.fn-card h3{margin:0;font-size:15px;color:var(--fn-navy)}.fn-card .sub{font-size:12px;color:var(--gray-500);margin:2px 0 12px}
.fn-bar{display:grid;grid-template-columns:120px 1fr 150px;gap:10px;align-items:center;margin:10px 0;font-size:13px;border-radius:10px;padding:2px 4px}.fn-bar.click{cursor:pointer}.fn-bar.click:hover{background:#f1f7fb}.fn-bar .t{height:16px;background:var(--gray-100);border-radius:999px;overflow:hidden}.fn-bar .t i{display:block;height:100%;border-radius:999px;transition:width 1.2s}.fn-bar .v{text-align:right}.fn-bar .v b{color:var(--text)}.fn-bar .v small{display:block;color:var(--gray-500);font-size:11px}

.fn-tb{width:100%;border-collapse:collapse;font-size:13px}.fn-tb th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500);padding:6px 8px;border-bottom:1px solid var(--gray-200)}.fn-tb td{padding:8px;border-bottom:1px solid var(--gray-100)}.fn-tb td.n,.fn-tb th.n{text-align:right;white-space:nowrap}

.fn-dl{display:inline-block;background:var(--fn-green);color:#fff;text-decoration:none;font-size:12px;font-weight:800;border-radius:999px;padding:8px 14px;border:0;cursor:pointer}
.fn-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.fn-tools input{flex:1;min-width:220px;padding:10px 14px;border:1px solid var(--gray-300);border-radius:999px;font-size:14px}
.fn-seg{display:inline-flex;background:var(--gray-100);border-radius:999px;padding:3px}.fn-seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--gray-500);cursor:pointer}.fn-seg button.on{background:#fff;color:var(--fn-navy);box-shadow:0 1px 3px #0002}
.fn-rules{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.fn-rule{background:#fff;border:1px solid var(--gray-200);border-left:5px solid #f59e0b;border-radius:12px;padding:12px 14px}.fn-rule b{display:block;color:var(--fn-navy)}.fn-rule span{font-size:12px;color:var(--gray-500)}
.fn-ep{font-family:monospace;font-size:12px;background:var(--gray-100);border-radius:8px;padding:6px 10px;margin:6px 0;word-break:break-all}.fn-ep em{font-style:normal;font-weight:800;color:var(--fn-green);margin-right:8px}.fn-ep.w em{color:#b45309}
.fn-mod{position:fixed;inset:0;background:rgba(15,42,74,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}.fn-mod>div{background:#fff;border-radius:18px;max-width:1000px;width:100%;max-height:86vh;display:flex;flex-direction:column}
.fn-mod header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 10px}.fn-mod header h3{margin:0;font-size:17px;color:var(--fn-navy)}.fn-mod header p{margin:3px 0 0;font-size:12px;color:var(--gray-500)}.fn-mod header button{border:0;background:var(--gray-100);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}.fn-mod .corpo{padding:0 22px 20px;overflow:auto}
@media(max-width:1000px){.fn-heads,.fn-alerts,.fn-rules{grid-template-columns:1fr 1fr}.fn-grid{grid-template-columns:1fr}}@media(max-width:560px){.fn-heads,.fn-alerts,.fn-rules{grid-template-columns:1fr}.fn-bar{grid-template-columns:90px 1fr 110px}}
</style>
