<style>
.fn,.fn-mod{--fn-navy:#0f2a4a;--fn-green:#0d9488}.fn{max-width:1400px}
.fn-hero{background:linear-gradient(120deg,#0f2a4a 0%,#134a63 55%,#0d7a6c 130%);border-radius:18px;padding:22px 26px 24px;color:#fff;margin-bottom:16px;box-shadow:0 10px 30px rgba(15,42,74,.25)}

.fn-heads{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}

.fn-head strong{display:block;font-size:30px;line-height:1.1;margin:6px 0 4px;letter-spacing:-.02em;white-space:nowrap}.fn-head em{font-style:normal;font-size:12px;color:#c4dcee}.fn-head.bad strong{color:#fecaca}
.fn-erro{background:#fde7e8;color:#b3262b;border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:12px}

.fn-alerts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}

</style>
