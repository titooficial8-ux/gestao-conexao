{% extends 'base.html' %}
{% block page_title %}{{ tab.name_pt if lang == 'pt' else tab.name_es }}{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='dist/index.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='dist/gc-theme.css') }}">
<div style="display:flex;justify-content:flex-end;padding:8px 24px 0"><a href="{{ url_for('previa_pcp.pagina') }}" style="background:linear-gradient(120deg,#6d28d9,#8b5cf6);color:#fff;font-weight:800;font-size:13.5px;border-radius:999px;padding:9px 18px;text-decoration:none;box-shadow:0 4px 14px rgba(109,40,217,.35)">&#128302; Prévia PCP · previsão de metros</a></div>
<div id="gestao-malharia-root"
     data-movimentos-url="{{ url_for('main.api_malharia_movimentos') }}"
     data-sequencia-url="{{ url_for('main.api_malharia_sequencia') }}"
     data-status-url="{{ url_for('main.api_malharia_status') }}"></div>
<script type="module" src="{{ url_for('static', filename='controle/gestao-malharia.js') }}"></script>
{% endblock %}
