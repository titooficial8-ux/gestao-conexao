{% extends 'base.html' %}
{% block page_title %}{{ tab.name_pt if lang == 'pt' else tab.name_es }}{% endblock %}
{% block content %}
<style>
  .pm { --cinza: #6a7b90; }
  .pm-topo { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin: 4px 0 14px; }
  .pm-topo h1 { margin: 0; font-size: 26px; line-height: 1.15; color: #0f2540; }
  .pm-sub { font-size: 12.5px; color: var(--cinza); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  .pm-dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; display: inline-block; margin-right: 6px; animation: biPonto 1.4s ease-in-out infinite; }
  .pm-aviso { margin: 0 0 14px; padding: 12px 16px; border-radius: 12px; background: #fff7e6; border: 1px solid #f3d9a4; color: #7a5200; font-size: 13px; line-height: 1.5; }
  .pm-meses { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .pm-hero { display: grid; grid-template-columns: 1.3fr 2fr 1.1fr; gap: 28px; padding: 26px 28px; border-radius: 18px; color: #fff; align-items: center;
    background: linear-gradient(100deg, rgba(8, 24, 44, .86) 0%, rgba(10, 37, 64, .72) 55%, rgba(14, 50, 88, .6) 100%), url('/static/img/fundo-estoque.jpg') center 55% / cover no-repeat, linear-gradient(120deg, #0a2540, #16508a); box-shadow: 0 12px 32px rgba(10, 37, 64, .25); }
  .pm-rot { font-size: 10.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #8fb4dc; }
  .pm-big { font-size: 44px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; margin: 8px 0 6px; font-variant-numeric: tabular-nums; }
  .pm-big small { font-size: 18px; font-weight: 700; color: #b9d0ea; margin-left: 6px; }
  .pm-txt { font-size: 12.5px; color: #b9d0ea; line-height: 1.5; }
  .pm-mid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; padding: 0 26px; border-left: 1px solid rgba(255, 255, 255, .14); border-right: 1px solid rgba(255, 255, 255, .14); }
  .pm-val { font-size: 30px; font-weight: 800; margin: 8px 0 4px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .pm-val small { font-size: 14px; font-weight: 700; color: #b9d0ea; margin-left: 4px; }
  .pm-risco .pm-val { color: #ffb4b4; }
  .pm-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 14px 0; }
  .pm-kpi { background: #fff; border: 1px solid #e1e9f3; border-radius: 14px; padding: 16px 18px; position: relative; overflow: hidden; box-shadow: 0 1px 2px rgba(16, 38, 63, .04), 0 8px 20px rgba(16, 38, 63, .05); }
  .pm-kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, #2f7fe0); }
  .pm-kpi-r { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #5d6e84; }
  .pm-kpi-v { font-size: 26px; font-weight: 800; color: #0f2540; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
  .pm-kpi-s { font-size: 12px; color: var(--cinza); line-height: 1.45; }
  .pm-linha { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .pm-card { background: #fff; border: 1px solid #e1e9f3; border-radius: 14px; padding: 18px 20px 14px; box-shadow: 0 1px 2px rgba(16, 38, 63, .04), 0 8px 20px rgba(16, 38, 63, .05); margin-bottom: 14px; }
  .pm-linha .pm-card { margin-bottom: 0; }
  .pm-card h3 { margin: 0 0 2px; font-size: 15px; color: #0f2540; }
  .pm-card p.m { margin: 0 0 10px; font-size: 12px; color: var(--cinza); }
  .pm-graf { position: relative; height: 330px; }
  .pm-vazio { color: var(--cinza); font-size: 13px; padding: 36px 10px; text-align: center; }
  .pm-pill { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 3px 10px; border-radius: 999px; letter-spacing: .03em; }
  .pm-pill.crit { background: #fdeaea; color: #b62027; }
  .pm-pill.aten { background: #fff3dc; color: #9a6200; }
  .pm-pill.ok { background: #e3f5ea; color: #11703c; }
  .pm-sec { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #46586e; margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
  .pm-sec::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, #d5dfec, transparent); }
  .pm-op { display: grid; grid-template-columns: 70px 60px minmax(140px, 1.4fr) minmax(120px, 1fr) 1.4fr 110px; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid #f0f3f8; cursor: pointer; font-size: 13px; }
  .pm-op:hover { background: #f5f8fc; }
  .pm-op.sel { background: #efe9fb; }
  .pm-op b { color: #0f2540; }
  .pm-op small { display: block; color: #7c8ca1; font-size: 11px; }
  .pm-op .k { text-align: right; font-weight: 800; color: #0f2540; font-variant-numeric: tabular-nums; }
  .pm-lista { max-height: 420px; overflow-y: auto; }
  .pm-det { margin-top: 12px; }
  .pm-bx { display: grid; grid-template-columns: minmax(150px, 1.6fr) minmax(110px, 1.2fr) 96px; gap: 12px; align-items: center; padding: 8px 4px; border-bottom: 1px solid #f0f3f8; }
  .pm-bx-n { font-size: 13px; font-weight: 700; color: #0f2540; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pm-bx-n small { display: block; font-weight: 500; font-size: 11px; color: #7c8ca1; }
  .pm-bx-b { height: 8px; border-radius: 8px; background: #edf1f7; overflow: hidden; }
  .pm-bx-b span { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, #8a5fe0, #b99cf0); }
  .pm-bx-k { text-align: right; font-weight: 800; font-size: 13px; color: #0f2540; font-variant-numeric: tabular-nums; }
  @media (max-width: 1100px) { .pm-hero { grid-template-columns: 1fr; } .pm-mid { border: 0; padding: 0; } .pm-kpis { grid-template-columns: repeat(2, 1fr); } .pm-linha { grid-template-columns: 1fr; } .pm-op { grid-template-columns: 60px 1fr 90px; } .pm-op .x { display: none; } }
</style>

<div class="pm">
  <div class="pm-topo">
    <div>
      <h1>{{ tab.name_pt if lang == 'pt' else tab.name_es }}</h1>
      <div class="pm-sub" id="pmStatus">Consultando o TOTVS…</div>
    </div>
    <button type="button" class="btn-small ticket-btn-outline" id="pmAtualizar">⟳ Atualizar agora</button>
  </div>
  <div id="pmAviso"></div>
  <div id="pmMeses" class="pm-meses"></div>
  <div id="pmCorpo"></div>
</div>

<script src="{{ url_for('static', filename='js/vendor/chart.umd.js') }}"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, dados = null, mesSel = 'todos', opSel = null, graf = {};
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
  function nf(v, d) { return v === null || v === undefined ? '—' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function pct(v, d) { return v === null || v === undefined ? '—' : nf(v * 100, d === undefined ? 0 : d) + '%'; }
  function dh(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + ' ' + iso.slice(11, 16) : '—'; }
  function curto(t, n) { t = String(t || ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; }
  function nomeCurto(nome) {
    var t = String(nome || '').toUpperCase().replace(/^\s*100\s*%?\s*(POLIESTER|POLYESTER)\s*/, '').replace(/\s+U\s*$/, '').replace(/\s+/g, ' ').trim(), w = t.split(' ');
    for (var n = 3; n >= 1; n--) { for (var i = 0; i + 2 * n <= w.length;) { if (w.slice(i, i + n).join(' ') === w.slice(i + n, i + 2 * n).join(' ')) w.splice(i + n, n); else i++; } }
    return w.join(' ') || String(nome || '');
  }
  var NM = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  function rotMes(m) { return m === 'todos' ? 'Todos os meses' : (m === 'sem' ? 'Sem data' : NM[+m.slice(5, 7) - 1] + '/' + m.slice(2, 4)); }
  function pill(c, t) { return el('span', 'pm-pill ' + c, t); }
  function kpi(r, v, s, cor) { var k = el('div', 'pm-kpi'); k.style.setProperty('--c', cor); k.appendChild(el('div', 'pm-kpi-r', r)); k.appendChild(el('div', 'pm-kpi-v', v)); k.appendChild(el('div', 'pm-kpi-s', s)); return k; }
  function cartao(t, m) { var c = el('div', 'pm-card'); c.appendChild(el('h3', null, t)); if (m) c.appendChild(el('p', 'm', m)); return c; }
  var EIXO = { grid: { color: 'rgba(120,130,150,.15)' }, border: { display: false } };

  function filtradas() { return dados.ops.filter(function (o) { return mesSel === 'todos' || (o.mes || 'sem') === mesSel; }); }
  function agregar(ops) {                                         // materias-primas somadas so das OPs filtradas, com o saldo do almoxarifado
    var m = {}, base = {}; dados.materias.forEach(function (x) { base[x.codigo] = x; });
    ops.forEach(function (o) { o.materias.forEach(function (x) { var a = m[x.codigo] = m[x.codigo] || { codigo: x.codigo, nome: x.nome, necessario: 0, ops: 0, saldo: base[x.codigo] ? base[x.codigo].saldo : null }; a.necessario += x.kg; a.ops++; }); });
    return Object.keys(m).map(function (k) { var a = m[k]; a.falta = a.saldo === null ? null : Math.max(a.necessario - a.saldo, 0); return a; }).sort(function (x, y) { return y.necessario - x.necessario; });
  }
  function barras(canvas, rotulos, series, opts) {
    return new Chart(canvas, { type: 'bar', data: { labels: rotulos, datasets: series }, options: Object.assign({ indexAxis: 'y', responsive: true, maintainAspectRatio: false, layout: { padding: { right: 70 } }, plugins: { legend: { display: series.length > 1, position: 'bottom' }, tooltip: { callbacks: { label: function (x) { return x.dataset.label + ': ' + nf(x.raw) + ' kg'; } } } }, scales: { x: Object.assign({ beginAtZero: true, ticks: { callback: function (v) { return nf(v); } } }, EIXO), y: { grid: { display: false }, ticks: { font: { size: 11 } } } } }, opts || {}),
      plugins: [{ id: 'rot', afterDatasetsDraw: function (ch) { var x = ch.ctx; x.save(); x.font = '700 11px sans-serif'; x.fillStyle = '#10263F'; x.textBaseline = 'middle'; var d0 = ch.getDatasetMeta(0).data; d0.forEach(function (e, i) { x.fillText(nf(series[0].data[i]) + ' kg', e.x + 6, e.y); }); x.restore(); } }] });
  }

  function desenhar() {
    var box = $('pmCorpo'); box.textContent = '';
    Object.keys(graf).forEach(function (k) { try { graf[k].destroy(); } catch (e) {} }); graf = {};
    if (!dados || !dados.pronto) { box.appendChild(el('div', 'pm-card pm-vazio', 'Lendo o consumo de matéria-prima das OPs no TOTVS… (a primeira vez demora alguns minutos)')); return; }
    if (dados.sem_dados) { var c0 = el('div', 'pm-card pm-vazio'); c0.appendChild(document.createTextNode('O TOTVS não devolveu consumo de matéria-prima para as OPs da Programação ainda.')); c0.appendChild(el('br')); c0.appendChild(document.createTextNode('Se continuar assim, o administrador abre /planejamento-mp/diagnostico e me manda o resultado.')); box.appendChild(c0); return; }
    var ops = filtradas(), mats = agregar(ops), total = mats.reduce(function (s, m) { return s + m.necessario; }, 0), risco = mats.filter(function (m) { return m.falta !== null && m.falta > 0; }), faltaTot = risco.reduce(function (s, m) { return s + m.falta; }, 0);

    var h = el('div', 'pm-hero'), a = el('div'); a.appendChild(el('div', 'pm-rot', 'Matéria-prima necessária · ' + rotMes(mesSel))); var big = el('div', 'pm-big', nf(total)); big.appendChild(el('small', null, 'kg')); a.appendChild(big);
    a.appendChild(el('div', 'pm-txt', 'consumo previsto das ' + ops.length + ' OPs em máquina na Programação')); h.appendChild(a);
    var m = el('div', 'pm-mid');
    function met(r, v, u, t, cls) { var d = el('div', cls || ''); d.appendChild(el('div', 'pm-rot', r)); var x = el('div', 'pm-val', v); if (u) x.appendChild(el('small', null, u)); d.appendChild(x); if (t) d.appendChild(el('div', 'pm-txt', t)); return d; }
    m.appendChild(met('OPs em máquina', String(ops.length), '', ops.filter(function (o) { return o.status === 'PRODUZINDO'; }).length + ' produzindo agora'));
    m.appendChild(met('Matérias-primas', String(mats.length), '', 'fios diferentes empenhados'));
    m.appendChild(met('Em risco de falta', String(risco.length), '', risco.length ? 'faltam ' + nf(faltaTot) + ' kg no almoxarifado' : 'estoque cobre a necessidade', risco.length ? 'pm-risco' : ''));
    h.appendChild(m);
    var c = el('div'); c.appendChild(el('div', 'pm-rot', 'Cobertura do almoxarifado')); var cobT = mats.length ? mats.reduce(function (s, x) { return s + Math.min(x.saldo === null ? x.necessario : x.saldo, x.necessario); }, 0) / (total || 1) : null; c.appendChild(el('div', 'pm-val', cobT === null ? '—' : pct(cobT, 0))); c.appendChild(el('div', 'pm-txt', 'da necessidade já está em estoque')); h.appendChild(c); box.appendChild(h);

    var top = mats[0], k = el('div', 'pm-kpis');
    k.appendChild(kpi('Maior consumo', top ? nf(top.necessario) + ' kg' : '—', top ? nomeCurto(top.nome) + ' · ' + pct(total ? top.necessario / total : 0, 0) + ' do total' : '', '#2f7fe0'));
    var top3 = mats.slice(0, 3).reduce(function (s, x) { return s + x.necessario; }, 0); k.appendChild(kpi('Top 3 concentram', pct(total ? top3 / total : 0, 0), 'da necessidade de matéria-prima', '#8a5fe0'));
    var opMax = ops.slice().sort(function (x, y) { return y.total - x.total; })[0]; k.appendChild(kpi('OP que mais consome', opMax ? nf(opMax.total) + ' kg' : '—', opMax ? 'OP ' + opMax.op + ' · máq. ' + (opMax.maquina || '—') + ' · ' + nomeCurto(opMax.cliente || '') : '', '#1f9d55'));
    k.appendChild(kpi('Falta no almoxarifado', nf(faltaTot) + ' kg', risco.length + ' matérias-primas com saldo menor que a necessidade', risco.length ? '#c0272d' : '#1f9d55')); box.appendChild(k);

    var l1 = el('div', 'pm-linha'), c1 = cartao('Matérias-primas que mais consomem produção', 'Necessário nas OPs × saldo no almoxarifado (top 10)'), cv1 = document.createElement('canvas'), w1 = el('div', 'pm-graf'); w1.appendChild(cv1); c1.appendChild(w1); l1.appendChild(c1);
    var t10 = mats.slice(0, 10);
    graf.mat = barras(cv1, t10.map(function (x) { return nomeCurto(x.nome); }), [{ label: 'Necessário', data: t10.map(function (x) { return Math.round(x.necessario); }), backgroundColor: '#2f7fe0', borderRadius: 4, barThickness: 12 }, { label: 'Em estoque', data: t10.map(function (x) { return Math.round(x.saldo || 0); }), backgroundColor: '#3ddc84', borderRadius: 4, barThickness: 12 }]);
    var porMaq = {}; ops.forEach(function (o) { var q = o.maquina || '—'; porMaq[q] = (porMaq[q] || 0) + o.total; });
    var maq = Object.keys(porMaq).map(function (q) { return [q, porMaq[q]]; }).sort(function (x, y) { return y[1] - x[1]; }).slice(0, 10);
    var c2 = cartao('Consumo previsto por máquina', 'Matéria-prima das OPs programadas em cada máquina (top 10)'), cv2 = document.createElement('canvas'), w2 = el('div', 'pm-graf'); w2.appendChild(cv2); c2.appendChild(w2); l1.appendChild(c2); box.appendChild(l1);
    graf.maq = barras(cv2, maq.map(function (x) { return 'Máquina ' + x[0]; }), [{ label: 'Consumo previsto', data: maq.map(function (x) { return Math.round(x[1]); }), backgroundColor: '#8a5fe0', borderRadius: 5, barThickness: 18 }]);

    var cr = cartao('Alertas de ruptura', 'Matérias-primas em que o saldo do almoxarifado não cobre o que as OPs vão consumir');
    if (!risco.length) cr.appendChild(el('div', 'pm-vazio', 'Nenhuma matéria-prima com risco de falta. 👍'));
    else { var lst = el('div', 'pm-lista'); risco.sort(function (x, y) { return y.falta - x.falta; }).slice(0, 15).forEach(function (x) { var r = el('div', 'pm-bx'), n = el('div', 'pm-bx-n', nomeCurto(x.nome)); n.title = x.nome; n.appendChild(el('small', null, 'necessário ' + nf(x.necessario) + ' kg · em estoque ' + nf(x.saldo) + ' kg · ' + x.ops + ' OPs')); r.appendChild(n);
        var b = el('div', 'pm-bx-b'), sp = el('span'); sp.style.background = 'linear-gradient(90deg,#c0272d,#ff8a8a)'; sp.style.width = Math.min(100, Math.max(x.falta / x.necessario * 100, 3)) + '%'; b.appendChild(sp); r.appendChild(b); r.appendChild(el('div', 'pm-bx-k', 'faltam ' + nf(x.falta) + ' kg')); lst.appendChild(r); }); cr.appendChild(lst); }
    box.appendChild(cr);

    var co = cartao('OPs em máquina · consumo de matéria-prima', 'Clique em uma OP para ver os fios que ela vai consumir'), lo = el('div', 'pm-lista');
    ops.slice().sort(function (x, y) { return y.total - x.total; }).forEach(function (o) {
      var r = el('div', 'pm-op' + (opSel === o.op ? ' sel' : '')); r.appendChild(el('div', null, 'OP ' + o.op)); r.appendChild(el('div', 'x', 'Máq. ' + (o.maquina || '—')));
      var d = el('div'); d.appendChild(el('b', null, nomeCurto(o.cliente || ''))); d.appendChild(el('small', null, 'artigo ' + (o.artigo || '—'))); r.appendChild(d);
      r.appendChild(el('div', 'x', o.termino ? 'término ' + o.termino.slice(8, 10) + '/' + o.termino.slice(5, 7) : '')); r.appendChild(el('div', 'x', o.materias.length ? nomeCurto(o.materias[0].nome) + (o.materias.length > 1 ? ' +' + (o.materias.length - 1) : '') : 'sem consumo informado'));
      r.appendChild(el('div', 'k', nf(o.total) + ' kg')); r.addEventListener('click', function () { opSel = opSel === o.op ? null : o.op; desenhar(); }); lo.appendChild(r); });
    co.appendChild(lo);
    var sel = ops.filter(function (o) { return o.op === opSel; })[0];
    if (sel) { var dt = el('div', 'pm-det'); dt.appendChild(el('h3', null, 'OP ' + sel.op + ' · ' + nomeCurto(sel.cliente || '') + ' · artigo ' + sel.artigo)); var mx = sel.materias.length ? sel.materias[0].kg || 1 : 1;
      sel.materias.forEach(function (x) { var r = el('div', 'pm-bx'), n = el('div', 'pm-bx-n', nomeCurto(x.nome)); n.title = x.nome; n.appendChild(el('small', null, 'código ' + x.codigo)); r.appendChild(n); var b = el('div', 'pm-bx-b'), sp = el('span'); sp.style.width = Math.max(x.kg / mx * 100, 3) + '%'; b.appendChild(sp); r.appendChild(b); r.appendChild(el('div', 'pm-bx-k', nf(x.kg) + ' kg')); dt.appendChild(r); }); co.appendChild(dt); }
    box.appendChild(co);
    box.appendChild(el('p', 'pm-txt', ''));
  }

  function meses() {
    var box = $('pmMeses'); box.textContent = '';
    if (!dados || !dados.pronto || dados.sem_dados) return;
    var set = {}; dados.ops.forEach(function (o) { set[o.mes || 'sem'] = 1; });
    var lista = ['todos'].concat(Object.keys(set).sort());
    lista.forEach(function (m) { var b = el('button', 'cme-grupo' + (m === mesSel ? ' active' : ''), rotMes(m)); b.type = 'button'; b.addEventListener('click', function () { mesSel = m; opSel = null; meses(); desenhar(); }); box.appendChild(b); });
  }

  function status() {
    var s = $('pmStatus'); s.textContent = ''; var av = $('pmAviso'); av.textContent = '';
    if (dados && dados.atualizado) { var a = el('span'); a.appendChild(el('span', 'pm-dot')); a.appendChild(document.createTextNode('TOTVS · ao vivo')); s.appendChild(a); s.appendChild(el('span', null, 'Atualizado ' + dh(dados.atualizado))); s.appendChild(el('span', null, 'OPs da Programação: ' + (dados.n_ops_lidas || 0))); } else s.textContent = 'Consultando o TOTVS…';
    if (dados && !dados.configurado) av.appendChild(el('div', 'pm-aviso', 'TOTVS não configurado no arquivo .env.'));
    else if (dados && dados.estado && dados.estado.erro) av.appendChild(el('div', 'pm-aviso', '⚠ Falha ao ler o consumo das OPs: ' + dados.estado.erro));
  }

  function carregar() {
    fetch('/planejamento-mp/dados', { credentials: 'same-origin' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function (d) {
      var sig = (d.atualizado || '') + '|' + d.pronto + '|' + ((d.estado && d.estado.erro) || ''); var mudou = sig !== $('pmCorpo').dataset.sig; dados = d; status();
      if (mudou) { $('pmCorpo').dataset.sig = sig; meses(); desenhar(); }
    }).catch(function (e) { $('pmStatus').textContent = 'Não consegui carregar (' + e.message + ').'; });
  }
  $('pmAtualizar').addEventListener('click', function () { $('pmStatus').textContent = 'Consultando o TOTVS…'; fetch('/planejamento-mp/atualizar', { method: 'POST', credentials: 'same-origin' }).then(function () { setTimeout(carregar, 6000); }); });
  carregar(); setInterval(carregar, 20000);
})();
</script>
{% endblock %}
