<style>
.info-i{border:1.5px solid #2f7fe0;color:#2f7fe0;background:#fff;border-radius:50%;width:20px;height:20px;font:800 12px/1 Georgia,serif;cursor:pointer;padding:0;margin-left:4px;vertical-align:middle}
.info-i.marca{background:#fecaca;border-color:#dc2626;color:#b91c1c}.info-i.pisca{background:#dc2626;border-color:#dc2626;color:#fff;animation:infoPisca 1s infinite}@keyframes infoPisca{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.7);opacity:1}50%{box-shadow:0 0 0 6px rgba(220,38,38,0);opacity:.45}}
.info-i:hover{background:#2f7fe0;color:#fff}
#infoMaq{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:3500;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
#infoMaq.on{display:flex}
.info-box{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:18px 22px;box-shadow:0 20px 60px rgba(15,23,42,.35);color:#1e293b}
.info-box h3{margin:0 0 2px;font-size:18px}.info-box h4{margin:18px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#64748b}
.info-fecha{float:right;border:0;background:#e5e7eb;border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:700}
.info-kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.info-kv div{background:#f1f5f9;border-radius:8px;padding:7px 10px}.info-kv small{display:block;color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.info-turnos{display:flex;gap:8px;margin-top:8px}.info-turnos div{flex:1;border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;text-align:center}.info-turnos b{font-size:20px;display:block}
.info-steps{display:flex;gap:6px;margin:8px 0 12px}.info-step{flex:1;text-align:center;font-size:11px;color:#64748b;background:none;border:0;cursor:pointer;padding:4px;border-radius:10px}.info-step.sel{background:#f1f5f9}.info-step i{display:block;width:30px;height:30px;border-radius:50%;background:#cbd5e1;color:#fff;font:800 11px/30px Arial;margin:0 auto 3px;font-style:normal}
.info-step.feito i{background:#16a34a}.info-step.atual i{background:#f59e0b;box-shadow:0 0 0 4px #fde68a}
.info-et{border:1px solid #e2e8f0;border-radius:10px;padding:9px 12px;margin-bottom:8px}.info-et.atual{border-color:#f59e0b;background:#fffbeb}.info-et b{font-size:12px;text-transform:uppercase}
.info-et dl{display:grid;grid-template-columns:170px 1fr;gap:2px 10px;margin:6px 0 0;font-size:13px}.info-et dt{color:#64748b}.info-et dd{margin:0;font-weight:700}
.info-oc{font-size:13px;border-bottom:1px solid #f1f5f9;padding:5px 0}.info-tag{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:1px 7px;color:#fff;background:#0e7490;margin-right:6px}
.info-tag.NC{background:#b91c1c}.info-tag.DEFEITO{background:#b91c1c}.info-tag.PRODUÇÃO{background:#475569}.info-tag.LIBERAÇÃO{background:#15803d}.info-vazio{color:#94a3b8;font-size:13px}
td.aj-pisca{animation:ajPisca 1s infinite;cursor:pointer;font-weight:900;color:#b45309}@keyframes ajPisca{0%,100%{background:#fde68a}50%{background:transparent}}
#ajMod{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:3600;display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}#ajMod.on{display:flex}
.aj-box{background:#fff;border-radius:14px;max-width:620px;width:100%;padding:18px 22px;color:#1e293b;box-shadow:0 20px 60px rgba(15,23,42,.35)}.aj-box h3{margin:0 0 4px}
.aj-box table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}.aj-box td,.aj-box th{border-bottom:1px solid #e2e8f0;padding:4px 6px;text-align:left}.aj-box textarea{width:100%;box-sizing:border-box;min-height:70px;border:1px solid #94a3b8;border-radius:8px;padding:8px;font:inherit}
.aj-bt{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.aj-bt button{border:0;border-radius:8px;padding:8px 16px;font-weight:800;cursor:pointer}.aj-ok{background:#15803d;color:#fff}.aj-no{background:#e5e7eb}
</style>
<div id="infoMaq"><div class="info-box"><button class="info-fecha" type="button">Fechar</button><div id="infoMaqCorpo">Carregando…</div></div></div>
<div id="ajMod"><div class="aj-box" id="ajCorpo"></div></div>
<script>
(function () {                      /* aumento de quantidade da OP (PCPFP084): total de pecas pisca ate o PCP justificar */
  var mq = document.querySelector('.info-i[data-maq]'), mod = document.getElementById('ajMod'), corpo = document.getElementById('ajCorpo');
  if (!mq) return;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function marcar() {
    fetch('/info/ajustes/' + mq.dataset.maq, { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!d) return;
      document.querySelectorAll('tr[data-seq-id] td.aj-pisca').forEach(function (td) { td.classList.remove('aj-pisca'); td.removeAttribute('data-aj'); });
      d.itens.forEach(function (a) {
        var td = document.querySelector('tr[data-seq-id="' + a.seq + '"] td:nth-child(3)');
        if (td) { td.classList.add('aj-pisca'); td.dataset.aj = a.id; td.title = 'Quantidade da OP aumentada no TOTVS: clique para ver o empenho e justificar'; }
      });
    }).catch(function () {});
  }
  marcar(); setInterval(marcar, 30000);
  document.addEventListener('click', function (ev) {
    var td = ev.target.closest('td.aj-pisca');
    if (td) {
      mod.classList.add('on'); corpo.textContent = 'Carregando…';
      fetch('/info/ajuste/' + td.dataset.aj, { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) {
        var a = d.ajuste;
        corpo.innerHTML = '<h3>OP ' + esc(a.op) + ' · quantidade aumentada</h3><div style="color:#64748b;font-size:13px">Máquina ' + esc(a.maquina) + ' · artigo ' + esc(a.artigo) + ' · detectado em ' + esc(a.quando) + ' (PCPFP084 · Acerto de Quantidade Real)</div>' +
          '<table><tr><th></th><th>Antes</th><th>Depois</th></tr><tr><td>Quantidade (m)</td><td>' + a.qt_antes + '</td><td><b>' + a.qt_depois + '</b> (+' + a.aumento + ')</td></tr><tr><td>Total de peças</td><td>' + a.pecas_antes + '</td><td><b>' + a.pecas_depois + '</b></td></tr></table>' +
          '<b style="font-size:12px;text-transform:uppercase;color:#64748b">Matéria-prima empenhada na OP</b>' + (d.aviso ? '<p style="color:#9a6200;font-size:13px">' + esc(d.aviso) + '</p>' : '<table><tr><th>Código</th><th>Material</th><th>Qtd / peso</th></tr>' + d.empenho.map(function (m) { return '<tr><td>' + esc(m.codigo) + '</td><td>' + esc(m.nome) + '</td><td>' + m.qtd + '</td></tr>'; }).join('') + '<tr><td colspan="2"><b>Total</b></td><td><b>' + d.total_kg + '</b></td></tr></table>') +
          '<b style="font-size:12px;text-transform:uppercase;color:#64748b;display:block;margin-top:10px">Justifique o motivo</b><textarea id="ajMotivo" placeholder="Por que a quantidade foi aumentada?"></textarea><div class="aj-bt"><button class="aj-no" type="button" id="ajFecha">Fechar</button><button class="aj-ok" type="button" id="ajConf">Confirmar</button></div>';
        document.getElementById('ajFecha').onclick = function () { mod.classList.remove('on'); };
        document.getElementById('ajConf').onclick = function () {
          fetch('/info/ajuste/' + a.id + '/confirmar', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ motivo: document.getElementById('ajMotivo').value }) })
            .then(function (r) { return r.json(); }).then(function (j) { if (j.erro) { alert(j.erro); return; } mod.classList.remove('on'); marcar(); });
        };
      }).catch(function () { corpo.textContent = 'Não foi possível carregar.'; });
    } else if (ev.target === mod) { mod.classList.remove('on'); }
  });
})();
</script>
<script>
(function () {
  var box = document.getElementById('infoMaq'), corpo = document.getElementById('infoMaqCorpo');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function kv(l, v) { return '<div><small>' + l + '</small><b>' + esc(v == null || v === '' ? '–' : v) + '</b></div>'; }
  function desenhar(d) {
    if (d.vazio) { corpo.innerHTML = '<h3>Máquina ' + d.maquina + '</h3><p class="info-vazio">Sem sequência programada.</p>'; return; }
    var a = d.acompanhamento, h = '<h3>Máquina ' + String(d.maquina).padStart(2, '0') + ' · OP ' + esc(a.op) + ' · ' + esc(a.artigo) + '</h3><div class="info-vazio">' + esc(a.cliente || '') + ' · ' + esc(a.situacao || a.status) + '</div>';
    var nOc = d.ocorrencias.length, abertas = d.ocorrencias.filter(function (o) { return o.aberta; }).length;
    if (nOc) h += '<div style="background:' + (abertas ? '#fee2e2' : '#fff7ed') + ';border:1px solid ' + (abertas ? '#dc2626' : '#fdba74') + ';color:' + (abertas ? '#991b1b' : '#9a3412') + ';border-radius:8px;padding:7px 12px;margin-top:8px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px"><span>⚠ ' + nOc + (nOc > 1 ? ' NC apontados' : ' NC apontada') + ' nesta máquina (reprova no cru)' + (abertas ? ' · ' + abertas + ' em aberto' : '') + '</span><button type="button" class="info-ver" style="border:0;border-radius:6px;padding:4px 14px;font-weight:800;cursor:pointer;background:#fff;color:inherit">VER</button></div>';
    h += '<h4>Acompanhamento de produção</h4><div class="info-kv">' + kv('Produzidas / total', a.produzidas + ' / ' + a.total) + kv('Meta por dia (pç)', a.meta_dia) + kv('Meta por turno (pç)', a.meta_turno) + kv('Término previsto (BETA TESTE)', a.termino) + kv('Estrutura', a.estrutura) + kv('RPM', a.rpm) + '</div>';
    h += '<div class="info-turnos">' + [0, 1, 2].map(function (i) { return '<div><small>' + (i + 1) + 'º turno</small><b>' + a.pesadas_turno[i] + '</b>pç pesadas' + (a.meta_turno ? ' / meta ' + Math.round(a.meta_turno) : '') + '</div>'; }).join('') + '</div><div class="info-vazio" style="margin-top:4px">Hoje: dia de produção iniciado em ' + a.inicio_dia + '</div>';
    h += '<div class="info-turnos" style="margin-top:10px">' + [0, 1, 2].map(function (i) { return '<div style="background:#f8fafc"><small>' + (i + 1) + 'º turno · dia anterior</small><b>' + a.pesadas_ontem[i] + '</b>pç pesadas' + (a.meta_turno ? ' / meta ' + Math.round(a.meta_turno) : '') + '</div>'; }).join('') + '</div><div class="info-vazio" style="margin-top:4px">Dia anterior (desta OP): iniciado em ' + a.inicio_ontem + '</div>';
    h += '<h4>Etapas de liberação (MEC + QUALI)</h4>';
    if (!d.etapas.length) { h += '<p class="info-vazio">Nenhuma liberação do SKU encontrada para este artigo nesta máquina' + (d.erro_sharepoint ? ' (SharePoint: ' + esc(d.erro_sharepoint) + ')' : '') + '.</p>'; }
    else {
      var L = d.liberacao;
      var sel = (d.etapas.filter(function (e) { return e.atual; })[0] || d.etapas[0]).cod;
      h += '<div class="info-vazio">' + esc(L.status || '') + ' · OP ' + esc(L.op) + ' · atualizado ' + esc(L.atualizado) + ' · <i>clique na etapa para ver os dados</i></div><div class="info-steps">' + d.etapas.map(function (e) { return '<button type="button" class="info-step ' + (e.atual ? 'atual' : (e.feito ? 'feito' : '')) + (e.cod === sel ? ' sel' : '') + '" data-et="' + e.cod + '"><i>' + e.cod + '</i>' + (e.atual ? 'atual' : (e.feito ? 'concluída' : 'pendente')) + '</button>'; }).join('') + '</div>';
      h += d.etapas.map(function (e) {
        return '<div class="info-et' + (e.atual ? ' atual' : '') + '" data-et="' + e.cod + '"' + (e.cod === sel ? '' : ' hidden') + '><b>' + e.cod + ' · ' + esc(e.titulo) + '</b>' + (e.itens.length ? '<dl>' + e.itens.map(function (i) { return '<dt>' + esc(i.k) + '</dt><dd>' + esc(i.v) + '</dd>'; }).join('') + '</dl>' : '<div class="info-vazio">sem registro</div>') + '</div>';
      }).join('');
      var reg = Object.keys(L.regulagem || {});
      if (reg.length) h += '<div class="info-et"><b>Regulagem registrada</b><dl>' + reg.map(function (k) { return '<dt>' + esc(k) + '</dt><dd>' + esc(L.regulagem[k]) + '</dd>'; }).join('') + '</dl></div>';
    }
    var colapsa = d.ocorrencias.length > 5;
    h += '<h4 class="info-oc-t" style="cursor:pointer;user-select:none"><span class="info-oc-seta">' + (colapsa ? '▶' : '▼') + '</span> Últimas ocorrências (apontadas na revisão do cru · este artigo nesta máquina) · ' + d.ocorrencias.length + '</h4><div class="info-oc-corpo"' + (colapsa ? ' hidden' : '') + '>' + (d.ocorrencias.length ? d.ocorrencias.map(function (o) {
      return '<div class="info-oc"><span class="info-tag NC">NC</span><b>' + esc(o.quando) + '</b> · ' + (o.resolvida ? '✔ resolvida · ' : '') + 'artigo <b>' + esc(o.artigo) + '</b> · OP <b>' + esc(o.op) + '</b> · ' + esc(o.cliente) + ' · ' + (o.avulsa ? '<b>OP AVULSA</b>' : 'com pedido') + '<br><small style="color:#64748b">peça ' + esc(o.peca) + ' · ' + esc(o.defeitos) + ' · ' + o.metros + ' m · ' + esc(o.origem) + (o.emitente ? ' · ' + esc(o.emitente) : '') + (o.obs ? ' · ' + esc(o.obs) : '') + '</small></div>';
    }).join('') : '<p class="info-vazio">Nenhum apontamento da revisão do cru para este artigo nesta máquina.</p>') + '</div>';
    corpo.innerHTML = h;
  }
  var mq = document.querySelector('.info-i[data-maq]');
  function piscar() {                      /* i vermelho piscando = a sequencia tem defeito/reprova apontado na revisao do cru */
    if (!mq) return;
    fetch('/info/maquina/' + mq.dataset.maq + '/alertas', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!d) return;
      document.querySelectorAll('.info-i[data-seq]').forEach(function (b) { var id = parseInt(b.dataset.seq, 10); b.classList.toggle('pisca', d.ids.indexOf(id) >= 0); b.classList.toggle('marca', (d.marca || []).indexOf(id) >= 0); });
    }).catch(function () {});
  }
  piscar(); setInterval(piscar, 30000);
  document.addEventListener('click', function (ev) {
    var ver = ev.target.closest('.info-ver'), tit = ev.target.closest('.info-oc-t');
    if (ver || tit) {
      var cp = corpo.querySelector('.info-oc-corpo'), st = corpo.querySelector('.info-oc-seta');
      if (ver) { cp.hidden = false; } else { cp.hidden = !cp.hidden; }
      st.textContent = cp.hidden ? '▶' : '▼';
      if (ver) corpo.querySelector('.info-oc-t').scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    var et = ev.target.closest('.info-step');
    if (et) {
      corpo.querySelectorAll('.info-step').forEach(function (x) { x.classList.toggle('sel', x === et); });
      corpo.querySelectorAll('.info-et[data-et]').forEach(function (x) { x.hidden = x.dataset.et !== et.dataset.et; });
      return;
    }
    var b = ev.target.closest('.info-i');
    if (b) {
      box.classList.add('on'); corpo.textContent = 'Carregando…';
      fetch('/info/maquina/' + b.dataset.maq + (b.dataset.seq ? '?seq=' + b.dataset.seq : ''), { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(desenhar).catch(function () { corpo.textContent = 'Não foi possível carregar.'; });
    } else if (ev.target === box || ev.target.closest('.info-fecha')) { box.classList.remove('on'); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') box.classList.remove('on'); });
})();
</script>
