{% extends 'base.html' %}
{% block page_title %}{{ tab.name_pt if lang == 'pt' else tab.name_es }}{% endblock %}
{% block content %}
<style>
.cm-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.cm-bar select,.cm-bar input{padding:8px 12px;border:1px solid var(--gray-300);border-radius:999px;font-size:14px;background:#fff;color:var(--text)}
.cm-bar .cm-grow{flex:1;min-width:200px}
.cm-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--gray-200);margin-bottom:16px}
.cm-tab{background:none;border:0;padding:10px 16px;font-size:14px;font-weight:700;color:var(--gray-500);cursor:pointer;border-bottom:3px solid transparent}
.cm-tab.on{color:var(--blue-700);border-bottom-color:var(--blue-600)}
.cm-tab small{background:var(--blue-100);color:var(--blue-700);border-radius:999px;padding:1px 8px;margin-left:6px}
.cm-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.cm-kpi{background:#fff;border:1px solid var(--gray-200);border-left:4px solid var(--blue-600);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.cm-kpi.art{border-left-color:#0d9488}
.cm-kpi span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500)}
.cm-kpi strong{display:block;font-size:28px;color:var(--text);margin-top:4px;line-height:1.1;white-space:nowrap}
.cm-kpi em{display:block;font-style:normal;font-size:12px;color:var(--gray-500);margin-top:3px}
.cm-sec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-500);margin:4px 2px 10px}
.cm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:6px}
.cm-card{background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.cm-card h3{margin:0 0 12px;font-size:15px;color:var(--blue-800)}
.cm-linha{display:grid;grid-template-columns:150px 1fr 140px;gap:12px;align-items:center;margin:9px 0;font-size:13px}
.cm-linha .nome{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-linha .barra{height:10px;background:var(--gray-100);border-radius:999px;overflow:hidden}
.cm-linha .barra i{display:block;height:100%;border-radius:999px;background:var(--blue-600)}
.cm-linha .val{text-align:right;color:var(--gray-700);white-space:nowrap;font-variant-numeric:tabular-nums}
.cm-linha .val b{color:var(--text)}
.cm-linha.zero .nome,.cm-linha.zero .val{color:var(--gray-500)}
.cm-aviso{background:#eef5ff;color:var(--blue-800);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px}
.cm-sel{padding:5px 8px;border:1px solid var(--gray-300);border-radius:8px;font-size:13px;background:#fff;max-width:170px}
.cm-sel.ok{border-color:#1f9d55;background:#f1fbf5}
.cm-inp{padding:5px 8px;border:1px solid var(--gray-300);border-radius:8px;font-size:13px;width:100%;min-width:130px;box-sizing:border-box}
.cm-salvo{font-size:11px;color:#17794a;margin-left:6px}
.cm-vazio{padding:22px;text-align:center;color:var(--gray-500)}
.cm-fonte{font-size:12px;color:var(--gray-500);margin:8px 2px}
.cm-erro{background:#fde7e8;color:#b3262b;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}

.cm-hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.cm-grp{background:#fff;border:1px solid var(--gray-200);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;border-top:5px solid var(--blue-600)}
.cm-grp.art{border-top-color:#0d9488}
.cm-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--blue-700);border-radius:999px;padding:3px 12px}
.cm-grp.art .cm-tag{background:#0d9488}
.cm-sub{font-size:13px;color:var(--gray-500);margin-left:8px}
.cm-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:14px 0 2px}
.cm-big b{font-size:56px;line-height:1;color:var(--text);letter-spacing:-.02em}
.cm-big span{font-size:15px;color:var(--gray-700)}
.cm-big span u{text-decoration:none;font-weight:800;color:#c2410c}
.cm-money{font-size:30px;font-weight:800;color:var(--blue-800);line-height:1.1}
.cm-grp.art .cm-money{color:#0f766e}
.cm-money small{display:block;font-size:12px;font-weight:500;color:var(--gray-500);margin-top:3px}
.cm-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--gray-500);margin:18px 0 8px}
.cm-donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cm-donut svg{flex:none}
.cm-leg{flex:1;min-width:170px;font-size:13px}
.cm-leg div{display:flex;align-items:center;gap:8px;margin:5px 0;color:var(--text)}
.cm-leg i{width:11px;height:11px;border-radius:3px;flex:none}
.cm-leg em{margin-left:auto;font-style:normal;font-weight:700;white-space:nowrap}
.cm-stack{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--gray-100)}
.cm-stack i{display:block;height:100%}
.cm-stackleg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:12px;color:var(--gray-700)}
.cm-stackleg span b{color:var(--text)}
.cm-chip{display:inline-block;background:var(--blue-50);color:var(--blue-800);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;margin:0 6px 6px 0}
.cm-gov{height:8px;border-radius:999px;background:var(--gray-100);overflow:hidden;margin-top:6px}
.cm-gov i{display:block;height:100%;border-radius:999px}
.cm-govt{display:flex;justify-content:space-between;font-size:12px;color:var(--gray-700)}
.cm-cols{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
.cm-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.cm-col i{display:block;width:100%;max-width:34px;background:linear-gradient(180deg,#1d9bf0,var(--blue-700));border-radius:6px 6px 0 0;min-height:3px}
.cm-col b{font-size:11px;color:var(--text);margin-bottom:3px}
.cm-col span{font-size:10px;color:var(--gray-500);margin-top:4px;white-space:nowrap}
.cm-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.cm-tile{background:var(--gray-50,#f6f8fb);border-radius:12px;padding:12px 14px;min-width:0}
.cm-tile span{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500)}
.cm-tile strong{display:block;font-size:30px;line-height:1.1;color:var(--text);margin:4px 0 2px;white-space:nowrap;letter-spacing:-.01em}
.cm-tile em{display:block;font-style:normal;font-size:12px;color:var(--gray-500)}
.cm-grp.art .cm-tile:nth-child(2) strong{color:#0f766e}.cm-grp:not(.art) .cm-tile:nth-child(2) strong{color:var(--blue-800)}
.cm-mot{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.cm-mot .barra{height:12px;background:var(--gray-100);border-radius:999px;overflow:hidden}.cm-mot .barra i{display:block;height:100%;border-radius:999px}
.cm-mot .val{text-align:right;white-space:nowrap;color:var(--gray-700)}.cm-mot .val b{color:var(--text)}
.cm-top{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin:10px 0;font-size:13px}
.cm-top .nome{font-weight:600;line-height:1.3}.cm-top .nome small{display:block;font-weight:500;color:var(--gray-500);font-size:11px}
.cm-top .val{text-align:right;white-space:nowrap}
.cm-top .barra{grid-column:1/3;height:6px;background:var(--gray-100);border-radius:999px;overflow:hidden}.cm-top .barra i{display:block;height:100%;background:var(--blue-600);border-radius:999px}
.cm-prio{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:980px){.cm-hero,.cm-prio{grid-template-columns:1fr}}
@media(max-width:520px){.cm-tiles{grid-template-columns:1fr}.cm-mot{grid-template-columns:110px 1fr 90px}}
@media(max-width:860px){.cm-grid2{grid-template-columns:1fr}.cm-linha{grid-template-columns:100px 1fr 120px}}
</style>

<div class="cm-bar">
  <label style="font-size:14px;font-weight:600">Sem comprar / rodar há:</label>
  <select id="cmMeses"><option value="3" selected>3 meses</option><option value="6">6 meses</option><option value="9">9 meses</option><option value="12">12 meses</option></select>
  <input type="search" id="cmBusca" class="cm-grow" placeholder="Buscar cliente ou artigo...">
  <button type="button" class="btn-small" id="cmCsv">&#11015; Excel (CSV)</button>
</div>

<div class="cm-tabs">
  <button type="button" class="cm-tab on" data-aba="ind">Estatísticas Comercial</button>
  <button type="button" class="cm-tab" data-aba="cli">Clientes que não compram <small id="cmNCli">0</small></button>
  <button type="button" class="cm-tab" data-aba="art">Artigos que não rodam <small id="cmNArt">0</small></button>
</div>
<div id="cmErro" class="cm-erro" hidden></div>

<section id="aba-ind"></section>
<section id="aba-cli" hidden></section>
<section id="aba-art" hidden></section>
<p class="cm-fonte" id="cmFonte"></p>

<script>
(function () {
  var URL_DADOS = '{{ url_for("cmi.dados") }}', URL_MOTIVO = '{{ url_for("cmi.salvar_motivo") }}', URL_EXPORT = '{{ url_for("cmi.exportar") }}', URL_ATUALIZAR = '{{ url_for("cmi.atualizar_artigos") }}';
  var D = null, aba = 'ind', sujo = false;
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined && txt !== null) e.textContent = txt; return e; }
  function nf(v, d) { return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function brl(v) { v = Number(v || 0); if (v >= 1e6) return 'R$ ' + nf(v / 1e6, 1) + ' mi'; if (v >= 1e4) return 'R$ ' + nf(v / 1e3, 0) + ' mil'; return 'R$ ' + nf(v, 0); }
  function metros(v) { v = Number(v || 0); return v >= 1e6 ? nf(v / 1e6, 1) + ' mi m' : v >= 1e4 ? nf(v / 1e3, 0) + ' mil m' : nf(v, 0) + ' m'; }
  var COR = { 'Preço': '#2f7fe0', 'Prazo de Entrega': '#f59e0b', 'Qualidade': '#ef4444', 'Desenvolvimento': '#7c3aed', 'Tirou de linha': '#0d9488', 'Problema de qualidade': '#ef4444', 'Sem motivo informado': '#cbd5e1' };
  function dia(iso) { var p = String(iso).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function kpi(r, v, s, cls) { var k = el('div', 'cm-kpi' + (cls ? ' ' + cls : '')); k.appendChild(el('span', null, r)); k.appendChild(el('strong', null, v)); if (s) k.appendChild(el('em', null, s)); return k; }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function donut(lista, centro, sub) {
    var total = lista.reduce(function (a, x) { return a + x.qtd; }, 0), R = 52, C = 2 * Math.PI * R, off = 0;
    var svg = document.createElementNS(SVGNS, 'svg'); svg.setAttribute('viewBox', '0 0 140 140'); svg.setAttribute('width', '140'); svg.setAttribute('height', '140');
    var fundo = document.createElementNS(SVGNS, 'circle'); fundo.setAttribute('cx', 70); fundo.setAttribute('cy', 70); fundo.setAttribute('r', R); fundo.setAttribute('fill', 'none'); fundo.setAttribute('stroke', '#eef2f7'); fundo.setAttribute('stroke-width', 20); svg.appendChild(fundo);
    lista.forEach(function (x) {
      if (!x.qtd) return; var len = x.qtd / total * C, c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('cx', 70); c.setAttribute('cy', 70); c.setAttribute('r', R); c.setAttribute('fill', 'none'); c.setAttribute('stroke', COR[x.motivo] || '#2f7fe0'); c.setAttribute('stroke-width', 20);
      c.setAttribute('stroke-dasharray', len + ' ' + (C - len)); c.setAttribute('stroke-dashoffset', -off); c.setAttribute('transform', 'rotate(-90 70 70)'); svg.appendChild(c); off += len;
    });
    var t1 = document.createElementNS(SVGNS, 'text'); t1.setAttribute('x', 70); t1.setAttribute('y', 70); t1.setAttribute('text-anchor', 'middle'); t1.setAttribute('font-size', 26); t1.setAttribute('font-weight', 800); t1.setAttribute('fill', '#16283c'); t1.textContent = centro; svg.appendChild(t1);
    var t2 = document.createElementNS(SVGNS, 'text'); t2.setAttribute('x', 70); t2.setAttribute('y', 88); t2.setAttribute('text-anchor', 'middle'); t2.setAttribute('font-size', 10); t2.setAttribute('fill', '#8494a6'); t2.textContent = sub; svg.appendChild(t2);
    return svg;
  }
  function motivos(lista, fmt) {
    var w = el('div'), total = lista.reduce(function (t, x) { return t + x.qtd; }, 0);
    lista.filter(function (x) { return x.qtd; }).sort(function (p, q) { return (p.motivo === 'Sem motivo informado') - (q.motivo === 'Sem motivo informado') || q.qtd - p.qtd; }).forEach(function (x) {
      var l = el('div', 'cm-mot'), n = el('span', 'nome', x.motivo), b = el('span', 'barra'), i = el('i'), v = el('span', 'val');
      i.style.width = Math.max(3, Math.round(x.qtd / total * 100)) + '%'; i.style.background = COR[x.motivo] || '#2f7fe0'; b.appendChild(i);
      v.appendChild(el('b', null, String(x.qtd))); v.appendChild(document.createTextNode(' · ' + fmt(x.valor)));
      l.appendChild(n); l.appendChild(b); l.appendChild(v); w.appendChild(l);
    });
    if (!total) w.appendChild(el('p', 'cm-vazio', 'Nada no período.'));
    return w;
  }
  var CORF = ['#22c55e', '#f59e0b', '#f97316', '#dc2626'];
  function faixas(lista, fmt) {
    var w = el('div'), total = lista.reduce(function (a, x) { return a + x.qtd; }, 0), st = el('div', 'cm-stack'), lg = el('div', 'cm-stackleg');
    lista.forEach(function (x, i) {
      if (x.qtd) { var seg = el('i'); seg.style.width = (x.qtd / total * 100) + '%'; seg.style.background = CORF[i] || '#dc2626'; seg.title = x.faixa + ': ' + x.qtd; st.appendChild(seg); }
      if (!x.qtd) return;
      var sp = el('span'), dot = el('i'); dot.style.cssText = 'display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:' + (CORF[i] || '#dc2626'); sp.appendChild(dot);
      sp.appendChild(document.createTextNode(x.faixa + ': ')); sp.appendChild(el('b', null, x.qtd + ' · ' + fmt(x.valor))); lg.appendChild(sp);
    });
    w.appendChild(st); w.appendChild(lg); return w;
  }
  function lista5(lista, fmt) {
    var w = el('div'); if (!lista.length) { w.appendChild(el('p', 'cm-vazio', 'Nada no período.')); return w; }
    var max = Math.max.apply(null, lista.map(function (x) { return x.valor; }).concat([1]));
    lista.forEach(function (x, k) {
      var l = el('div', 'cm-top'), n = el('div', 'nome'); n.appendChild(el('b', null, (k + 1) + '. ')); n.appendChild(document.createTextNode(x.nome)); n.appendChild(el('small', null, 'parado há ' + nf(x.meses, 1) + ' meses'));
      var b = el('span', 'barra'), i = el('i'); i.style.width = Math.round(x.valor / max * 100) + '%'; b.appendChild(i);
      l.appendChild(n); l.appendChild(el('b', 'val', fmt(x.valor))); l.appendChild(b); w.appendChild(l);
    });
    return w;
  }
  function gov(pct) {
    var w = el('div'), t = el('div', 'cm-govt'); t.appendChild(el('span', null, 'Motivo informado pelo comercial')); t.appendChild(el('b', null, pct + '%')); w.appendChild(t);
    var g = el('div', 'cm-gov'), i = el('i'); i.style.width = pct + '%'; i.style.background = pct >= 80 ? '#22c55e' : pct >= 40 ? '#f59e0b' : '#ef4444'; g.appendChild(i); w.appendChild(g); return w;
  }
  function grupo(cls, tag, sub, big, bigTxt, money, moneySub, mot, fmt, fx, concentr, top, topTit, pct) {
    var tagQtd = cls ? 'Artigos parados' : 'Clientes parados', tagVal = cls ? 'Volume parado' : 'Faturamento em risco';
    var g = el('div', 'cm-grp' + (cls ? ' ' + cls : '')), h = el('div'); h.appendChild(el('span', 'cm-tag', tag)); h.appendChild(el('span', 'cm-sub', sub)); g.appendChild(h);
    var t = el('div', 'cm-tiles'), cor = pct >= 80 ? '#16a34a' : pct >= 40 ? '#d97706' : '#dc2626';
    function tile(r, v, sb, c) { var d = el('div', 'cm-tile'); d.appendChild(el('span', null, r)); var st = el('strong', null, v); if (c) st.style.color = c; d.appendChild(st); d.appendChild(el('em', null, sb)); return d; }
    t.appendChild(tile(tagQtd, big, bigTxt));
    t.appendChild(tile(tagVal, money, moneySub));
    t.appendChild(tile('Com motivo', pct + '%', pct ? 'informado pelo comercial' : 'nenhum informado ainda', cor));
    g.appendChild(t);
    g.appendChild(el('div', 'cm-h', 'Por que pararam')); g.appendChild(mot);
    g.appendChild(el('div', 'cm-h', 'Há quanto tempo pararam (mais recente = mais fácil de recuperar)')); g.appendChild(fx);
    if (concentr) { g.appendChild(el('div', 'cm-h', 'Concentração')); g.appendChild(el('span', 'cm-chip', concentr[0])); g.appendChild(el('span', 'cm-chip', concentr[1])); }
    g.appendChild(el('div', 'cm-h', topTit)); g.appendChild(top);
    return g;
  }
  function prioridade(titulo, lista, fmt) {
    var c = el('div', 'cm-card'); c.appendChild(el('h3', null, titulo));
    if (!lista.length) { c.appendChild(el('p', 'cm-vazio', 'Todos os principais já têm motivo informado. ✓')); return c; }
    lista.forEach(function (x) { var l = el('div', 'cm-linha'), n = el('span', 'nome', x.nome); n.title = x.nome; l.style.gridTemplateColumns = '1fr 130px 90px'; l.appendChild(n); l.appendChild(el('span', 'val', fmt(x.valor))); l.appendChild(el('span', 'val', nf(x.meses, 1) + ' meses')); c.appendChild(l); });
    return c;
  }
  function desenharInd() {
    var s = document.getElementById('aba-ind'); s.textContent = ''; var I = D.indicadores, c = I.clientes, a = I.artigos, semOps = !D.fonte_artigos.total;
    var hero = el('div', 'cm-hero');
    hero.appendChild(grupo('', 'CLIENTES', 'sem comprar há ' + D.meses + '+ meses', String(c.total), c.base ? 'de ' + c.base + ' da base (' + c.pct_base + '%)' : 'clientes',
      brl(c.valor_em_risco), 'em 12 meses' + (c.pct_receita ? ' · ' + c.pct_receita + '% da receita MI' : ''),
      motivos(c.por_motivo, brl), brl, faixas(c.faixas, brl), c.pct_top10 ? ['3 maiores = ' + c.pct_top3 + '% do risco', '10 maiores = ' + c.pct_top10 + '% do risco'] : null,
      lista5(c.top, brl), 'Maiores faturamentos em risco', c.pct_informado));
    if (semOps) { var av = el('div', 'cm-grp art'); var h = el('div'); h.appendChild(el('span', 'cm-tag', 'ARTIGOS')); av.appendChild(h); av.appendChild(el('div', 'cm-aviso', 'A leitura das OPs no TOTVS ainda não rodou. Ela roda sozinha a cada hora, ou abra a aba "Artigos que não rodam" e clique em "Atualizar OPs do TOTVS".')); hero.appendChild(av); }
    else hero.appendChild(grupo('art', 'ARTIGOS', 'sem rodar há ' + D.meses + '+ meses', String(a.total), a.base ? 'de ' + a.base + ' do portfólio (' + a.pct_base + '%)' : 'artigos',
      metros(a.metros_12m), 'metros/ano' + (a.pct_metros ? ' · ' + a.pct_metros + '% do volume' : ''),
      motivos(a.por_motivo, metros), metros, faixas(a.faixas, metros), null, lista5(a.top, metros), 'Mais metros parados', a.pct_informado));
    s.appendChild(hero);
    var pr = el('div', 'cm-prio'); pr.appendChild(prioridade('Ação: clientes de maior valor sem motivo informado', c.sem_motivo, brl));
    pr.appendChild(prioridade('Ação: artigos de maior volume sem motivo informado', a.sem_motivo, metros)); s.appendChild(pr);
    var mes = el('div', 'cm-card'); mes.appendChild(el('h3', null, 'Quando os clientes deixaram de comprar (mês da última compra)'));
    var max = Math.max.apply(null, c.saida_por_mes.map(function (x) { return x.qtd; }).concat([1]));
    if (!c.saida_por_mes.length) mes.appendChild(el('p', 'cm-vazio', 'Nenhum cliente no período.'));
    var cols = el('div', 'cm-cols');
    c.saida_por_mes.slice(-14).forEach(function (x) { var col = el('div', 'cm-col'); col.appendChild(el('b', null, String(x.qtd))); var i = el('i'); i.style.height = Math.max(4, Math.round(x.qtd / max * 100)) + '%'; col.appendChild(i); col.appendChild(el('span', null, x.mes.slice(5) + '/' + x.mes.slice(2, 4))); cols.appendChild(col); });
    if (c.saida_por_mes.length) mes.appendChild(cols); s.appendChild(mes);
  }
  function seletor(tipo, x, lista) {
    var sel = el('select', 'cm-sel' + (x.motivo ? ' ok' : '')); var o0 = el('option', null, '— motivo —'); o0.value = ''; sel.appendChild(o0);
    lista.forEach(function (m) { var o = el('option', null, m); o.value = m; if (m === x.motivo) o.selected = true; sel.appendChild(o); });
    return sel;
  }
  function ligarSalvar(tipo, x, linha, campos, ref) {
    var aviso = el('span', 'cm-salvo'), t = null;
    function salvar() {
      var corpo = { tipo: tipo, chave: x.chave, nome: x.nome, motivo: campos.motivo.value, obs: campos.obs.value, desenho: campos.desenho ? campos.desenho.value : '' };
      fetch(URL_MOTIVO, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) })
        .then(function (r) { return r.json(); }).then(function (d) {
          if (!d.ok) { aviso.textContent = d.erro || 'Erro'; return; }
          x.motivo = corpo.motivo; x.obs = corpo.obs; if (campos.desenho) x.desenho = corpo.desenho; sujo = true;
          campos.motivo.className = 'cm-sel' + (x.motivo ? ' ok' : ''); aviso.textContent = 'salvo ✓';
          setTimeout(function () { aviso.textContent = ''; }, 2500);
        }).catch(function () { aviso.textContent = 'falha ao salvar'; });
    }
    campos.motivo.addEventListener('change', salvar);
    [campos.obs, campos.desenho].forEach(function (i) { if (i) i.addEventListener('input', function () { clearTimeout(t); t = setTimeout(salvar, 900); }); });
    return aviso;
  }
  function tabela(tipo, lista, colunas, motivos, busca) {
    var w = el('div', 'table-card'), sc = el('div', 'table-scroll'), tb = el('table', 'data-table prod-table'), th = el('thead'), hr = el('tr');
    colunas.forEach(function (c) { hr.appendChild(el('th', null, c)); }); th.appendChild(hr); tb.appendChild(th);
    var body = el('tbody'), n = 0;
    lista.forEach(function (x) {
      if (busca && (x.nome + ' ' + (x.cod || '') + ' ' + (x.clientes || '')).toLowerCase().indexOf(busca) < 0) return;
      n++; var l = el('tr');
      if (tipo === 'cliente') {
        [x.nome, dia(x.ultima), nf(x.meses, 1) + ' meses', String(x.pedidos_12m), brl(x.valor_12m), metros(x.metros_12m)].forEach(function (t, i) { var td = el('td', null, t); if (i === 0) td.style.fontWeight = '700'; l.appendChild(td); });
      } else {
        var td0 = el('td', null, x.cod); td0.style.fontWeight = '700'; l.appendChild(td0);
        [x.nome, dia(x.ultima), nf(x.meses, 1) + ' meses', String(x.ops_12m), metros(x.metros_12m), x.clientes || '–'].forEach(function (t) { l.appendChild(el('td', null, t)); });
      }
      var campos = { motivo: seletor(tipo, x, motivos), obs: el('input', 'cm-inp') };
      campos.obs.placeholder = 'Observação'; campos.obs.value = x.obs || ''; campos.obs.maxLength = 500;
      var tdm = el('td'); tdm.appendChild(campos.motivo); l.appendChild(tdm);
      if (tipo === 'artigo') { campos.desenho = el('input', 'cm-inp'); campos.desenho.placeholder = 'Desenho / amostra'; campos.desenho.value = x.desenho || ''; campos.desenho.maxLength = 200; var td = el('td'); td.appendChild(campos.desenho); l.appendChild(td); }
      var tdo = el('td'); tdo.appendChild(campos.obs); tdo.appendChild(ligarSalvar(tipo, x, l, campos, function () { desenharInd(); })); l.appendChild(tdo);
      body.appendChild(l);
    });
    if (!n) { var tr = el('tr'), td = el('td', 'cm-vazio', lista.length ? 'Nenhum resultado para a busca.' : 'Nenhum registro no período.'); td.colSpan = colunas.length; tr.appendChild(td); body.appendChild(tr); }
    tb.appendChild(body); sc.appendChild(tb); w.appendChild(sc); return w;
  }
  function desenharCli() {
    var s = document.getElementById('aba-cli'); s.textContent = '';
    s.appendChild(tabela('cliente', D.clientes, ['Cliente', 'Última compra', 'Sem comprar há', 'Pedidos (12 m antes)', 'Faturamento (12 m antes)', 'Metros (12 m antes)', 'Motivo', 'Observação'], D.motivos.cliente, document.getElementById('cmBusca').value.trim().toLowerCase()));
  }
  function desenharArt() {
    var s = document.getElementById('aba-art'); s.textContent = '';
    var f = D.fonte_artigos; var barra = el('div', 'cm-bar');
    var b = el('button', 'btn-small', 'Atualizar OPs do TOTVS'); b.type = 'button';
    b.addEventListener('click', function () { b.disabled = true; b.textContent = 'Atualizando…'; fetch(URL_ATUALIZAR, { method: 'POST', credentials: 'same-origin' }).then(function () { setTimeout(carregar, 8000); }); });
    barra.appendChild(b); barra.appendChild(el('span', 'cm-fonte', f.total ? 'Base: ' + f.total + ' artigos com OPs no TOTVS' + (f.ultima ? ' · atualizada em ' + f.ultima.replace('T', ' ').slice(0, 16) : '') : 'Ainda sem leitura das OPs: clique em "Atualizar OPs do TOTVS".'));
    s.appendChild(barra);
    if (f.erro) { var e = el('div', 'cm-erro', 'Última leitura do TOTVS falhou: ' + f.erro); s.appendChild(e); }
    s.appendChild(tabela('artigo', D.artigos, ['Artigo', 'Descrição', 'Última OP', 'Parado há', 'OPs (12 m antes)', 'Metros (12 m antes)', 'Clientes', 'Motivo', 'Desenho da amostra', 'Observação'], D.motivos.artigo, document.getElementById('cmBusca').value.trim().toLowerCase()));
  }
  function mostrar() {
    ['ind', 'cli', 'art'].forEach(function (a) { document.getElementById('aba-' + a).hidden = a !== aba; });
    document.querySelectorAll('.cm-tab').forEach(function (b) { b.classList.toggle('on', b.dataset.aba === aba); });
    document.getElementById('cmBusca').style.display = aba === 'ind' ? 'none' : '';
    document.getElementById('cmCsv').style.display = aba === 'ind' ? 'none' : '';
  }
  function desenharTudo() { document.getElementById('cmNCli').textContent = D.clientes.length; document.getElementById('cmNArt').textContent = D.artigos.length; desenharInd(); desenharCli(); desenharArt(); mostrar(); }
  function carregar() {
    var m = document.getElementById('cmMeses').value;
    fetch(URL_DADOS + '?meses=' + m, { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) {
      var e = document.getElementById('cmErro'); if (!d.ok) { e.hidden = false; e.textContent = d.erro || 'Não foi possível carregar.'; return; } e.hidden = true; D = d; desenharTudo();
      document.getElementById('cmFonte').textContent = 'Clientes: pedidos de venda do mercado interno e Artigos: OPs (data de abertura), tudo lido direto do TOTVS e atualizado a cada 2 minutos. Os valores "12 m antes" somam os 12 meses anteriores à última compra/OP.';
    }).catch(function () { var e = document.getElementById('cmErro'); e.hidden = false; e.textContent = 'Falha ao carregar os dados.'; });
  }
  document.querySelectorAll('.cm-tab').forEach(function (b) { b.addEventListener('click', function () { aba = b.dataset.aba; mostrar(); if (aba === 'ind' && sujo) { sujo = false; carregar(); } }); });
  document.getElementById('cmMeses').addEventListener('change', carregar);
  document.getElementById('cmBusca').addEventListener('input', function () { if (D) { desenharCli(); desenharArt(); } });
  document.getElementById('cmCsv').addEventListener('click', function () { location.href = URL_EXPORT + '?tipo=' + (aba === 'art' ? 'artigos' : 'clientes') + '&meses=' + document.getElementById('cmMeses').value; });
  carregar();
  setInterval(function () { var a = document.activeElement; if (document.hidden || (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) return; carregar(); }, 120000);   // atualiza sozinho a cada 2 min (sem atrapalhar quem esta digitando)
})();
</script>
{% endblock %}
